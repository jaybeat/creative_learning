<style>/* —— 画布与画面元素（640×360） —— */
.f,.f *{box-sizing:border-box}
.f{width:640px;height:360px;position:relative;background:#fafaf8;color:#333;overflow:hidden;font-size:14px}
.abs{position:absolute}.rel{position:relative}
.t{position:absolute;left:24px;top:14px;font-size:20px;font-weight:700}
.new{outline:3px solid #f08c00!important;outline-offset:2px}
.hl{background:#ffe8cc!important}
.dim{opacity:.35}
.note{font-size:13px;color:#777}
.mini{font-size:11px;color:#999}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#e9ecef;font-size:13px;margin-right:6px}
.tag.big{font-size:18px;padding:4px 14px;background:#d0ebff}
.ed{display:inline-block;border:2px solid #999;border-radius:6px;padding:4px 12px;font:22px/1.4 Consolas,monospace;background:#fff;min-width:130px;margin-right:8px;vertical-align:top}
.ed.big{font-size:30px;min-width:220px}.ed.sm{font-size:15px;min-width:64px;padding:2px 8px}
.ed.flash{box-shadow:0 0 0 3px #d0ebff}
.cur{color:#e03131;font-weight:700}
.inp{border:2px solid #bbb;border-radius:20px;padding:6px 16px;width:280px;background:#fff;font-size:16px}
.keys .key{display:inline-block;border:2px solid #888;border-bottom-width:4px;border-radius:5px;width:36px;text-align:center;font:18px Consolas,monospace;margin-right:8px;background:#fff}
.cells{display:flex;align-items:center}
.cell{border:2px solid #777;display:flex;align-items:center;justify-content:center;font:20px Consolas,monospace;background:#fff;margin-left:-2px;position:relative}
.cells.gap .cell{margin-left:0}
.ct{position:absolute;top:-19px;font-size:11px;color:#555;white-space:nowrap;font-family:sans-serif}
.ci{position:absolute;bottom:-19px;font-size:11px;color:#888;white-space:nowrap;font-family:sans-serif}
.arr{margin:0 6px;color:#555;font-size:18px}
.brace{font:13px Consolas,monospace;color:#555}
.dash{border:2px dashed #999;border-radius:8px;padding:12px;position:relative}
.dl{position:absolute;right:-48px;top:18px;font-size:14px;color:#666}
.gear{font-size:44px;text-align:center;line-height:1}.gear div{font-size:14px}
.goal{font-size:16px;text-align:center;line-height:1.8}
.qc{background:#fff;border:2px solid #4dabf7;border-radius:8px;padding:6px 12px;font-size:14px;width:340px}
.qc .qh{font-weight:700;color:#1971c2}.qc ol{margin:4px 0 0;padding-left:20px}.qc li{margin:2px 0}
.qc li.on{background:#ffe8cc;border-radius:3px}.qc li.ok{color:#2b8a3e}
.qc.big{font-size:20px;width:380px}
.qc.mid{width:220px}
.qc.corner{position:absolute;right:10px;top:10px;width:190px;font-size:10px;padding:4px 8px}
.okm{color:#2b8a3e;margin-left:6px}.nom{color:#c92a2a;margin-left:6px}.okm.big{font-size:22px}
.acc{width:360px}
.row{border:1.5px solid #ccc;border-radius:6px;background:#fff;margin-bottom:4px;padding:3px 10px;display:flex;align-items:center;gap:10px;min-height:24px;font-size:13px}
.row .rn{font-weight:700;width:80px;flex:none}.row .rs{color:#555;font-family:Consolas,monospace}
.row.open{display:block;border-color:#888}.row.open .rn{margin-bottom:2px}
.card{background:#fff;border:1.5px solid #bbb;border-radius:8px;padding:8px 12px}
.card .ch{font-weight:700;margin-bottom:6px}
.log .lr{border:1px solid #ddd;border-radius:4px;padding:1px 8px;font-size:12px;background:#f8f9fa}
.log .la{text-align:center;font-size:10px;line-height:10px;color:#888}
.checks{position:absolute;bottom:10px;left:12px;right:12px}
.card{position:relative}
.ck{border:1px solid #ddd;border-radius:4px;padding:1px 8px;margin-top:3px;font-size:12px;background:#fff}
.tree text{font-size:12px;text-anchor:middle;fill:#333}.tree .nd{fill:#fff;stroke:#888}.tree line{stroke:#888;stroke-width:1.5}
.tree .hl line{stroke:#f08c00;stroke-width:3}
.cands div{margin-bottom:3px}.cands .ed{padding:0 8px}.strike .ed{text-decoration:line-through}
.neq{font-size:30px;margin:0 10px;color:#c92a2a;vertical-align:middle}
.bounce{display:inline-block;border:1px dashed #c92a2a;border-radius:4px;padding:2px 8px;margin-right:8px;color:#c92a2a}
.counter{font:16px Consolas,monospace;padding:2px 8px;display:inline-block}
.qz-h{font-weight:700;color:#1971c2;margin-bottom:4px}.qz-s{font-size:12px;color:#555;margin-bottom:4px}

.btns{text-align:right;margin-top:4px}.btn{display:inline-block;background:#dee2e6;border-radius:4px;padding:1px 14px;font-size:12px}
.pts{margin:6px 0}
.pause{position:absolute;inset:0;background:rgba(255,248,230,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:#a06000}
.pause .pi{font-size:46px}

body{margin:0;background:#eceae4;font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;color:#333}
main{max-width:980px;margin:0 auto;padding:16px}
/* 底部控制区（照抖音/B站）：上面一条按每屏时长分段的进度线，下面一行按钮 */
.dock{position:relative;margin-top:6px}
.bar{display:flex;align-items:center;gap:10px;height:40px}
#time{flex:none;font-size:13px;color:#666;font-variant-numeric:tabular-nums}
/* 屏名就是目录按钮（照 YouTube 章节名）：☰ 屏名 ▾，点开从左下往上弹出全部屏 */
.nav{flex:0 1 auto;min-width:0;position:relative}
#menu{max-width:100%;gap:6px;padding:0 8px 0 6px;font-weight:400}
#scr{min-width:0;font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{flex:none;font-size:10px;opacity:.55}
#next{flex:none;font-weight:400}
#next[hidden]{display:none}
#prog{display:flex;gap:3px;align-items:center;height:16px}
.seg{min-width:6px;height:16px;display:flex;align-items:center;cursor:pointer}
.seg b{display:block;position:relative;width:100%;height:4px;border-radius:2px;background:#ddd;overflow:hidden;transition:height .12s}
#prog:hover .seg b{height:6px}
.seg i{position:absolute;left:0;top:0;bottom:0;background:#222}
.tools{flex:none;display:flex;align-items:center;gap:2px;position:relative;margin-left:auto}
.ib{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#333;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font:600 13px/1 inherit}
.ib:hover{background:rgba(0,0,0,.06)}
.ib svg{width:20px;height:20px}
.ib .i-pause,.ib.on .i-play{display:none}.ib.on .i-pause{display:block}
.ib.txt{width:auto;min-width:32px;padding:0 6px}
#capOn[aria-pressed=true]{background:#e4ecf6;color:#0e3061}
/* 目录从屏名按钮向上弹出：开始时间 + 屏名，当前屏加粗带"▶" */
#toc{position:absolute;left:0;bottom:38px;z-index:30;background:#fff;border:1px solid #ddd;border-radius:12px;padding:6px;min-width:260px;max-width:min(420px,90vw);max-height:60vh;overflow:auto;box-shadow:0 -10px 30px -10px rgba(0,0,0,.25)}
#toc[hidden],#tip[hidden]{display:none}
#toc button{display:flex;width:100%;gap:12px;border:0;background:none;padding:7px 10px;border-radius:8px;font:13px/1.4 inherit;cursor:pointer;color:inherit;text-align:left}
#toc button:hover{background:rgba(0,0,0,.05)}#toc button.cur{font-weight:700}
#toc em{flex:none;width:3em;font-style:normal;opacity:.55;font-variant-numeric:tabular-nums}
#toc button.cur em{opacity:1}
#toc button.cur em::before{content:"▶ ";font-size:9px;vertical-align:1px}
#tip{position:absolute;top:-30px;transform:translateX(-50%);background:#222;color:#fff;font-size:12px;line-height:1.5;padding:3px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:31}
#pal{font:inherit;font-size:12px;margin-left:6px}
/* 嵌入网站节页：全屏学习层（网站 CourseSwitch.vue 把 iframe 铺满视口）。左上角 ×，中间舞台 + 字幕，底部控制区贴着视口下沿；舞台按宽高两个方向缩放（fit） */
.emb{display:none!important}
body.embed .emb{display:inline-flex!important}
body.embed{background:transparent!important;overflow:hidden}
body.embed.th-clean{background:var(--page)!important}
body.embed main{max-width:none!important;box-sizing:border-box;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:52px 24px 6px!important}
body.embed #exit{position:fixed;top:10px;left:14px;z-index:40}
body.embed .wrap{flex:none;margin:auto auto 0}
body.embed #cap{flex:none;margin:14px auto auto}
body.embed .dock{flex:none}
@media (max-width:640px){body.embed main{padding:48px 10px 4px!important}.bar{gap:6px}#scr,.caret,#speed{display:none}}
@media (max-width:400px){#time{display:none}}
.wrap{position:relative;box-sizing:border-box;width:100%;aspect-ratio:16/9;background:#fafaf8;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.stage{position:absolute;left:0;top:0;width:640px;height:360px;transform-origin:0 0}
.stage .f{position:absolute;left:0;top:0}
.player .new{outline:none!important}
.f .pause{display:none}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(250,250,248,.85);z-index:20}
.cover[hidden]{display:none}
.cover button{display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:none;cursor:pointer;color:#555;font:14px/1.4 inherit;padding:0}
.cover .big{width:64px;height:64px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center}
.cover .big svg{width:28px;height:28px;margin-left:3px}
#cap{min-height:3.2em;max-width:80%;margin:14px auto 0;font-size:17px;line-height:1.6;text-align:center;color:#222}
#cap.off{visibility:hidden}
.quiz{position:absolute;inset:12px;background:#fff;border:1.5px solid #bbb;border-radius:10px;padding:10px 16px;overflow:auto;font-size:13px;z-index:5}
.quiz .qh{font-weight:700;color:#1971c2}
.quiz .qs{margin:2px 0 6px;color:#444}
.qopt{display:block;width:100%;text-align:left;border:1px solid #ccc;border-radius:6px;padding:3px 10px;margin:3px 0;background:#fff;cursor:pointer;font:inherit;color:inherit}
.qopt.sel{border-color:#1971c2;background:#e7f5ff}
.qopt.right{border-color:#2b8a3e;background:#ebfbee}
.qopt.wrong{border-color:#c92a2a;background:#fff5f5}
.qopt .why{display:none;font-size:11px;color:#666}
.qopt.right .why,.qopt.wrong .why{display:block}
.qbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:6px}
.qbar .fb{margin-right:auto;font-weight:700}
.qbar .fb.ok{color:#2b8a3e}.qbar .fb.no{color:#c92a2a}
.qbar button{font:inherit;padding:2px 14px;border-radius:5px;border:1px solid #bbb;background:#f1f3f5;cursor:pointer}
.qbar button.go{background:#1971c2;color:#fff;border-color:#1971c2}
.qbar button:disabled{opacity:.4;cursor:default}
.qex{display:none;font-size:12px;color:#555;margin-top:4px}
.quiz.done .qex{display:block}
.export .qbar button{display:none}
.export .quiz{padding:8px 14px}
.export .qopt{padding:2px 10px;margin:2px 0}
.export .qopt.right .why{display:inline;margin-left:10px}
.export .think{margin-top:6px;padding:4px 12px}
.export .qex{margin-top:2px}
.think{margin-top:8px;padding:6px 12px;border-radius:8px;background:#fff3bf;color:#a06000;font-size:15px;text-align:center}
.think b{font-size:20px;margin-left:6px}
.think.ans{background:#ebfbee;color:#2b8a3e}

.th-clean{--page:#faf8f4;--stage:#fdfdfd;--paper:#ffffff;--ink-strong:#0a0a0a;--ink:#1f1f1f;--mute:#5f5f5f;--faint:#8a8a8a;--line:#e0dfe2;--line-soft:#ececec;--line-cell:#cfcfd3;--dash:#d4d4d4;--c1-soft:#e4ecf6;--c1:#0e3061;--c1-line:#b9c9e2;--c2-soft:#e5f5f2;--c2:#0f6e5a;--warm-soft:#fbebe3;--warm:#97412a;--ok:#1d8a66;--off:#9b9b9b;--caret:#2f6bd8;--btn:#ececee;--track:#e9e5da}

/* —— 质感层：覆盖 FRAME_CSS 的原版元素 —— */
.th-clean .f{background:var(--stage);color:var(--ink);font-family:"CleanSans","Microsoft YaHei","PingFang SC",sans-serif;font-size:13px;line-height:1.6}
.th-clean .t{font-family:"CleanSerif","Songti SC","SimSun",serif;font-weight:700;font-size:19px;color:var(--ink-strong);top:14px;line-height:1.4}
/* 分镜墙审帧标记：这一帧新出现的元素（播放器和对比页里去掉） */
.th-clean .new{outline:1.5px dashed var(--caret)!important;outline-offset:3px}
.th-clean .note{color:var(--mute);font-size:12.5px}
.th-clean .mini{font-size:12px;color:var(--faint)}
.th-clean .dim{opacity:.4}
.th-clean .hl{background:var(--c1-soft)!important;color:var(--c1)}
.th-clean .tag{background:var(--paper);border:1px solid var(--line-soft);border-radius:999px;padding:1px 10px;font-size:12.5px;line-height:1.6}
.th-clean .tag.big{background:var(--c1-soft);color:var(--c1);border-color:transparent;font-weight:600;font-size:16px;padding:3px 14px}
.th-clean .ed{border:1px solid var(--line-cell);border-radius:8px;font-family:"CleanMono",Consolas,monospace;background:var(--paper);color:var(--ink-strong);line-height:1.4}
.th-clean .ed.flash{box-shadow:0 0 0 3px var(--c1-soft)}
.th-clean .cur{color:var(--caret);font-weight:400}
.th-clean .inp{border:1px solid var(--line-cell);border-radius:999px;background:var(--paper);font-size:15px}
.th-clean .keys .key{border:1px solid var(--line-cell);border-bottom-width:2px;border-radius:6px;font-family:"CleanMono",Consolas,monospace;background:var(--paper)}
.th-clean .cell{border:1px solid var(--line-cell);font-family:"CleanMono",Consolas,monospace;background:var(--paper);color:var(--ink-strong);margin-left:-1px}
/* 格子分三层画法：默认是逻辑画法（分开的方块，只说谁在第几个）；.mem 是顺序表（共边连续，下面标地址）；链表用 .c-node */
.th-clean .cells .cell{margin:0 8px 0 0;border-radius:6px}
.th-clean .cells .cell:last-child,.th-clean .cells.gap .cell{margin-right:0}
.th-clean .cells.mem .cell{margin:0 0 0 -1px;border-radius:0}
.th-clean .cells.mem .cell:first-child{border-radius:6px 0 0 6px}
.th-clean .cells.mem .cell:last-child{border-radius:0 6px 6px 0}
.th-clean .cells.mem .ci{font-family:"CleanMono",Consolas,monospace}
.th-clean .ct{font-size:12px;color:var(--mute);font-family:"CleanSans","Microsoft YaHei","PingFang SC",sans-serif;top:-21px}
.th-clean .ci{font-size:12px;color:var(--faint);font-family:"CleanSans","Microsoft YaHei","PingFang SC",sans-serif;bottom:-21px}
.th-clean .arr{color:var(--faint);font-size:15px}
.th-clean .brace,.th-clean .counter{font-family:"CleanMono",Consolas,monospace;color:var(--mute)}
.th-clean .dash{border:1px dashed var(--dash);border-radius:10px}
.th-clean .dl{color:var(--mute)}
.th-clean .okm{color:var(--ok)}
.th-clean .nom{color:var(--off)}
.th-clean .neq{color:var(--mute)}
.th-clean .bounce{border:1px dashed var(--dash);border-radius:999px;color:var(--off);text-decoration:line-through}
.th-clean .strike .ed{text-decoration:line-through;color:var(--off)}
/* 问题卡：大卡发丝框；角落小卡只留当前那一问，做成小标签 */
.th-clean .qc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.th-clean .qc .qh{color:var(--warm);font-size:12px;font-weight:600}
.th-clean .qc li.on{background:var(--c1-soft);color:var(--c1);border-radius:4px}
.th-clean .qc li.ok{color:var(--ok)}
.th-clean .qc.corner{right:16px;top:16px;width:auto;max-width:300px;border:0;border-radius:999px;background:var(--warm-soft);color:var(--warm);padding:1px 10px;font-size:12px;font-weight:500}
.th-clean .qc.corner .qh{display:none}
.th-clean .qc.corner ol{margin:0;padding:0;list-style:none}
.th-clean .qc.corner li{display:none;margin:0;background:none;color:inherit}
.th-clean .qc.corner li.on{display:block}
.th-clean .qc.corner li:nth-child(1).on::before{content:"问题 1 · "}
.th-clean .qc.corner li:nth-child(2).on::before{content:"问题 2 · "}
.th-clean .qc.corner li:nth-child(3).on::before{content:"问题 3 · "}
/* 手风琴：1px 淡线，展开行不加深；行名 600；结果用等宽 */
.th-clean .row{border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:13px}
.th-clean .row .rn{font-weight:600}
.th-clean .row .rs{color:var(--mute);font-family:"CleanMono",Consolas,monospace}
.th-clean .row.open{border-color:var(--line)}

<script>const DATA = {"title":"第2章开场 + 2.1 线性表 · 双栏稿（课程化试点）","total":250.938,"steps":[{"k":"beat","n":1,"text":"你每天都在一行里敲字：","audio":"audio/b001.mp3","start":0,"dur":1.696,"end":1.946,"card":0},{"k":"beat","n":2,"text":"搜索框、聊天框、给文件起名字的框。","audio":"audio/b002.mp3","start":1.946,"dur":2.694,"end":5.09,"card":0},{"k":"beat","n":3,"text":"这一章，我们自己做一个这样的单行编辑器。","audio":"audio/b003.mp3","start":5.09,"dur":2.647,"end":7.987,"card":1},{"k":"beat","n":4,"text":"它只管一行文字。","audio":"audio/b004.mp3","start":7.987,"dur":1.291,"end":9.728,"card":1},{"k":"beat","n":5,"text":"用户依次敲入c、a、t，","audio":"audio/b005.mp3","start":9.728,"dur":2.029,"end":12.206999999999999,"card":2},{"k":"beat","n":6,"text":"把光标左移一格，","audio":"audio/b006.mp3","start":12.207,"dur":1.38,"end":14.036999999999999,"card":3},{"k":"beat","n":7,"text":"敲x，","audio":"audio/b007.mp3","start":14.037,"dur":0.742,"end":15.229,"card":4},{"k":"beat","n":8,"text":"最后按一次退格。","audio":"audio/b008.mp3","start":15.229000000000001,"dur":1.203,"end":16.882,"card":5},{"k":"beat","n":9,"text":"每做一个动作，程序都要把整行重新显示出来，","audio":"audio/b009.mp3","start":16.882,"dur":3.676,"end":21.008,"card":6},{"k":"beat","n":10,"text":"所以它得一直记着这一行字。","audio":"audio/b010.mp3","start":21.008000000000003,"dur":2.163,"end":23.621000000000002,"card":7},{"k":"beat","n":11,"text":"这一行字，一个字符接一个字符排成一列。","audio":"audio/b011.mp3","start":23.621000000000002,"dur":2.996,"end":27.067,"card":8},{"k":"beat","n":12,"text":"在数据结构里，这样的数据叫线性表。","audio":"audio/b012.mp3","start":27.067000000000004,"dur":2.398,"end":29.915000000000003,"card":9},{"k":"beat","n":13,"text":"学完接下来几节，","audio":"audio/b013.mp3","start":29.915000000000003,"dur":1.628,"end":31.793000000000003,"card":10},{"k":"beat","n":14,"text":"你会用C亲手做出这个编辑器的第一版。","audio":"audio/b014.mp3","start":31.793000000000003,"dur":2.759,"end":35.002,"card":10},{"k":"beat","n":16,"text":"要做出这个编辑器，得先回答三个问题：","audio":"audio/b016.mp3","start":35.002,"dur":2.552,"end":38.004000000000005,"card":11},{"k":"beat","n":17,"text":"程序要记住这一行字的什么？","audio":"audio/b017.mp3","start":38.004000000000005,"dur":2.056,"end":40.510000000000005,"card":12},{"k":"beat","n":18,"text":"要对它做哪些事？","audio":"audio/b018.mp3","start":40.510000000000005,"dur":1.302,"end":42.26200000000001,"card":13},{"k":"beat","n":19,"text":"怎么把它放进内存？","audio":"audio/b019.mp3","start":42.26200000000001,"dur":1.292,"end":44.00400000000001,"card":14},{"k":"beat","n":20,"text":"先记住这三个问题。我们从第一个开始。","audio":"audio/b020.mp3","start":44.004000000000005,"dur":2.288,"end":47.192,"card":15},{"k":"beat","n":21,"text":"这一行字可以看成一个线性表。","audio":"audio/b021.mp3","start":47.19200000000001,"dur":1.841,"end":49.48300000000001,"card":16},{"k":"beat","n":22,"text":"把字符换成任意一种元素，","audio":"audio/b022.mp3","start":49.483000000000004,"dur":1.753,"end":51.486000000000004,"card":17},{"k":"beat","n":23,"text":"n个同类型的元素排成一列，就是线性表。","audio":"audio/b023.mp3","start":51.486000000000004,"dur":2.566,"end":54.50200000000001,"card":17},{"k":"beat","n":24,"text":"n叫表的长度。","audio":"audio/b024.mp3","start":54.502,"dur":1.232,"end":56.184000000000005,"card":18},{"k":"beat","n":25,"text":"元素的位置从0开始编号。","audio":"audio/b025.mp3","start":56.184000000000005,"dur":1.975,"end":58.60900000000001,"card":19},{"k":"beat","n":26,"text":"第0个元素记作a零，最后一个是第n减1个。","audio":"audio/b026.mp3","start":58.609,"dur":3.152,"end":62.211000000000006,"card":20},{"k":"beat","n":27,"text":"屏幕上的cat，就是c、a、t组成的表，","audio":"audio/b027.mp3","start":62.211,"dur":2.914,"end":65.575,"card":21},{"k":"beat","n":28,"text":"长度是3。","audio":"audio/b028.mp3","start":65.575,"dur":0.837,"end":66.86200000000001,"card":22},{"k":"beat","n":29,"text":"这个定义里有四个要点，逐条看。","audio":"audio/b029.mp3","start":66.86200000000001,"dur":2.18,"end":69.49200000000002,"card":23},{"k":"beat","n":30,"text":"第一，同类型。","audio":"audio/b030.mp3","start":69.492,"dur":1.035,"end":70.777,"card":24},{"k":"beat","n":31,"text":"表里的元素都是同一种东西。","audio":"audio/b031.mp3","start":70.777,"dur":1.883,"end":73.11,"card":24},{"k":"beat","n":32,"text":"c、a、t都是字符，不会混进整数或图片。","audio":"audio/b032.mp3","start":73.11,"dur":3.019,"end":76.57900000000001,"card":25},{"k":"beat","n":33,"text":"所以程序只需要准备一种格子，专门放字符。","audio":"audio/b033.mp3","start":76.579,"dur":2.871,"end":79.89999999999999,"card":26},{"k":"beat","n":34,"text":"第二，一个接一个。","audio":"audio/b034.mp3","start":79.89999999999999,"dur":1.61,"end":81.96,"card":27},{"k":"beat","n":35,"text":"一个元素前面紧挨着的那个，叫它的前驱。","audio":"audio/b035.mp3","start":81.96,"dur":2.722,"end":85.13199999999999,"card":28},{"k":"beat","n":36,"text":"后面紧挨着的那个，叫它的后继。","audio":"audio/b036.mp3","start":85.13199999999999,"dur":2,"end":87.582,"card":29},{"k":"beat","n":37,"text":"除了第一个，每个元素恰好有一个前驱；","audio":"audio/b037.mp3","start":87.582,"dur":2.498,"end":90.53,"card":30},{"k":"beat","n":38,"text":"除了最后一个，每个元素恰好有一个后继。","audio":"audio/b038.mp3","start":90.53,"dur":2.504,"end":93.48400000000001,"card":31},{"k":"beat","n":39,"text":"程序为什么要在乎先后？","audio":"audio/b039.mp3","start":93.484,"dur":1.476,"end":95.21,"card":32},{"k":"beat","n":40,"text":"因为cat和act是两行不同的字。","audio":"audio/b040.mp3","start":95.21,"dur":2.782,"end":98.442,"card":32},{"k":"beat","n":41,"text":"只记住有c、a、t三个字符，就打印不出这一行。","audio":"audio/b041.mp3","start":98.442,"dur":3.347,"end":102.23899999999999,"card":33},{"k":"beat","n":42,"text":"它还得记住谁在谁前面。","audio":"audio/b042.mp3","start":102.23899999999999,"dur":1.772,"end":104.461,"card":34},{"k":"beat","n":43,"text":"第三，个数有限。","audio":"audio/b043.mp3","start":104.46099999999998,"dur":1.241,"end":105.95199999999998,"card":35},{"k":"beat","n":44,"text":"表的长度n是一个确定的数，可以是0。","audio":"audio/b044.mp3","start":105.95199999999998,"dur":2.52,"end":108.92199999999998,"card":35},{"k":"beat","n":45,"text":"长度为0的表叫空表。","audio":"audio/b045.mp3","start":108.92199999999998,"dur":1.521,"end":110.69299999999998,"card":36},{"k":"beat","n":46,"text":"编辑器刚启动时，这一行就是空表。","audio":"audio/b046.mp3","start":110.69299999999998,"dur":2.694,"end":113.83699999999999,"card":36},{"k":"beat","n":47,"text":"之后每敲一个字符，长度加1。","audio":"audio/b047.mp3","start":113.83699999999999,"dur":2.04,"end":116.127,"card":37},{"k":"beat","n":48,"text":"程序任何时候都要知道现在有几个字符，","audio":"audio/b048.mp3","start":116.127,"dur":2.467,"end":118.844,"card":37},{"k":"beat","n":49,"text":"否则就不知道显示到哪里为止。","audio":"audio/b049.mp3","start":118.844,"dur":1.958,"end":121.252,"card":37},{"k":"beat","n":50,"text":"第四，可以重复。","audio":"audio/b050.mp3","start":121.252,"dur":1.137,"end":122.639,"card":38},{"k":"beat","n":51,"text":"同一个元素可以出现在不同的位置。","audio":"audio/b051.mp3","start":122.639,"dur":1.94,"end":125.029,"card":38},{"k":"beat","n":52,"text":"敲book时有两个o，两个都要记住。","audio":"audio/b052.mp3","start":125.029,"dur":2.44,"end":127.719,"card":39},{"k":"beat","n":53,"text":"它们分别是第1个和第2个元素。","audio":"audio/b053.mp3","start":127.719,"dur":2.034,"end":130.20299999999997,"card":39},{"k":"beat","n":54,"text":"回到本章开头的第一个问题：","audio":"audio/b054.mp3","start":130.203,"dur":1.648,"end":132.101,"card":40},{"k":"beat","n":55,"text":"程序要记住这一行字的什么？","audio":"audio/b055.mp3","start":132.101,"dur":1.94,"end":134.291,"card":40},{"k":"beat","n":56,"text":"这一行字可以看成一个线性表，","audio":"audio/b056.mp3","start":134.291,"dur":2.281,"end":137.022,"card":40},{"k":"beat","n":57,"text":"所以程序得记住三样东西：","audio":"audio/b057.mp3","start":137.022,"dur":1.941,"end":139.41299999999998,"card":41},{"k":"beat","n":58,"text":"有哪些元素，它们的先后，现在有几个。","audio":"audio/b058.mp3","start":139.41299999999998,"dur":2.268,"end":142.581,"card":42},{"k":"beat","n":59,"text":"这两样东西，能不能看成线性表？","audio":"audio/b059.mp3","start":142.581,"dur":2.262,"end":145.29299999999998,"card":43},{"k":"beat","n":60,"text":"一样是手机里的通话记录，按时间从新到旧排。","audio":"audio/b060.mp3","start":145.29299999999998,"dur":3.072,"end":148.81499999999997,"card":44},{"k":"beat","n":61,"text":"另一样是一个家族的家谱。","audio":"audio/b061.mp3","start":148.81499999999997,"dur":1.521,"end":150.78599999999994,"card":45},{"k":"beat","n":62,"text":"先看通话记录。","audio":"audio/b062.mp3","start":150.78599999999997,"dur":1.029,"end":152.26499999999996,"card":46},{"k":"beat","n":63,"text":"每条都是通话记录，同一种东西。","audio":"audio/b063.mp3","start":152.265,"dur":2.083,"end":154.79799999999997,"card":47},{"k":"beat","n":64,"text":"记录本来就按时间排着。","audio":"audio/b064.mp3","start":154.79799999999997,"dur":1.611,"end":156.85899999999995,"card":48},{"k":"beat","n":65,"text":"除了最新和最旧的两条，","audio":"audio/b065.mp3","start":156.85899999999998,"dur":2.231,"end":159.53999999999996,"card":49},{"k":"beat","n":66,"text":"每条恰好有一个前驱、一个后继。","audio":"audio/b066.mp3","start":159.54,"dur":2.233,"end":162.22299999999998,"card":50},{"k":"beat","n":67,"text":"条数是确定的，有限。","audio":"audio/b067.mp3","start":162.22299999999998,"dur":1.634,"end":164.30699999999996,"card":51},{"k":"beat","n":68,"text":"再看家谱。","audio":"audio/b068.mp3","start":164.307,"dur":0.788,"end":165.545,"card":52},{"k":"beat","n":69,"text":"每个元素都是一个人，同一种东西。","audio":"audio/b069.mp3","start":165.545,"dur":2.287,"end":168.28199999999998,"card":53},{"k":"beat","n":70,"text":"辈分确实有先后，","audio":"audio/b070.mp3","start":168.28199999999998,"dur":1.263,"end":169.99499999999998,"card":54},{"k":"beat","n":71,"text":"但一个人可以有好几个孩子，","audio":"audio/b071.mp3","start":169.99499999999998,"dur":1.707,"end":172.15199999999996,"card":55},{"k":"beat","n":72,"text":"这个人的后继不止一个。","audio":"audio/b072.mp3","start":172.152,"dur":1.616,"end":174.218,"card":56},{"k":"beat","n":73,"text":"到这里就能下结论，不用再看个数。","audio":"audio/b073.mp3","start":174.218,"dur":2.596,"end":177.26399999999998,"card":57},{"k":"beat","n":74,"text":"通话记录可以看成线性表。","audio":"audio/b074.mp3","start":177.26399999999998,"dur":1.739,"end":179.253,"card":58},{"k":"beat","n":75,"text":"家谱不能，因为它不是一个接一个。","audio":"audio/b075.mp3","start":179.253,"dur":2.091,"end":181.79399999999998,"card":58},{"k":"beat","n":76,"text":"两样东西差别只在是不是一个接一个。","audio":"audio/b076.mp3","start":181.79399999999998,"dur":2.406,"end":185.1,"card":59},{"k":"beat","n":77,"text":"轮到你了。","audio":"audio/b077.mp3","start":185.1,"dur":0.808,"end":186.158,"card":60},{"k":"beat","n":78,"text":"判断的办法：元素是不是同一种东西，","audio":"audio/b078.mp3","start":186.158,"dur":2.452,"end":188.85999999999999,"card":60},{"k":"beat","n":79,"text":"是不是一个接一个，个数是不是有限。","audio":"audio/b079.mp3","start":188.85999999999999,"dur":2.461,"end":191.771,"card":60},{"k":"pause","quiz":0,"start":191.771,"end":206.62099999999998,"card":61,"think":5},{"k":"beat","n":80,"text":"再来一题。","audio":"audio/b080.mp3","start":206.62099999999998,"dur":0.715,"end":207.58599999999998,"card":62},{"k":"beat","n":81,"text":"c、a、t没有按字母顺序排，它还是线性表吗？","audio":"audio/b081.mp3","start":207.58599999999998,"dur":3.987,"end":212.02299999999997,"card":62},{"k":"pause","quiz":1,"start":212.023,"end":223.673,"card":63,"think":5},{"k":"beat","n":82,"text":"教材里常说线性表是有序的。","audio":"audio/b082.mp3","start":223.673,"dur":2.194,"end":226.117,"card":64},{"k":"beat","n":83,"text":"这个有序指位置有先后，不是按大小排序。","audio":"audio/b083.mp3","start":226.117,"dur":2.75,"end":229.31699999999998,"card":64},{"k":"beat","n":84,"text":"c、a、t和a、c、t都是线性表，","audio":"audio/b084.mp3","start":229.31699999999998,"dur":2.409,"end":231.97599999999997,"card":65},{"k":"beat","n":85,"text":"而且是两个不同的表。","audio":"audio/b085.mp3","start":231.97599999999997,"dur":1.293,"end":233.51899999999998,"card":65},{"k":"beat","n":86,"text":"同样三个字符，位置不同，表就不同。","audio":"audio/b086.mp3","start":233.51899999999998,"dur":2.509,"end":236.92799999999997,"card":65},{"k":"beat","n":87,"text":"到这里，你有了线性表的定义和四个要点：","audio":"audio/b087.mp3","start":236.92799999999997,"dur":2.848,"end":240.02599999999998,"card":66},{"k":"beat","n":88,"text":"同类型、一个接一个、个数有限、可以重复。","audio":"audio/b088.mp3","start":240.02599999999998,"dur":3.387,"end":243.66299999999998,"card":66},{"k":"beat","n":89,"text":"屏幕上的一行字，可以看成一个字符的线性表。","audio":"audio/b089.mp3","start":243.66299999999998,"dur":2.831,"end":246.94399999999996,"card":66},{"k":"beat","n":90,"text":"下一步：编辑器要对这一行字做哪些事？","audio":"audio/b090.mp3","start":246.944,"dur":2.794,"end":250.938,"card":67}],"cards":[{"id":"0-01","html":"\u003cdiv class=\"abs\" s const tip = $('tip')
const segAt = (s, el, e) => {
  const r = el.getBoundingClientRect(); return s.start + (s.end - s.start) * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
}
const segs = DATA.screens.map((s) => {
  const el = document.createElement('div'); el.className = 'seg'; el.innerHTML = '<b><i></i></b>'
  el.style.flex = (s.end - s.start).toFixed(2) + ' 1 0'
  el.onclick = (e) => { $('cover').hidden = true; seek(segAt(s, el, e), true) }
  el.onmousemove = (e) => {
    const box = $('dock').getBoundingClientRect()
    tip.textContent = s.name + '　' + fmt(segAt(s, el, e)) + ' / ' + fmt(DATA.total); tip.hidden = false
    const half = tip.offsetWidth / 2
    tip.style.left = Math.max(half, Math.min(box.width - half, e.clientX - box.left)) + 'px'
  }
  el.onmouseleave = () => { tip.hidden = true }
  $('prog').appendChild(el); return el
})
const fill = segs.map((el) => el.querySelector('i'))
// —— 跳屏：目录里点哪屏跳哪屏；"下一屏"跳到下一屏开头。都从屏首开始放 ——
const toc = $('toc')
const closeToc = () => { toc.hidden = true; $('menu').setAttribute('aria-expanded', 'false') }
const goScreen = (s) => { closeToc(); $('cover').hidden = true; seek(s.start, true) }
DATA.screens.forEach((s) => {
  const b = document.createElement('button')
  b.innerHTML = '<em>' + fmt(s.start) + '</em><span>' + s.name + '</span>'
  b.onclick = () => goScreen(s)
  toc.appendChild(b)
})
let scrIdx = 0
$('next').onclick = () => { const s = DATA.screens[scrIdx + 1]; if (s) goScreen(s) }

// —— 画面层：每帧一个 .f，只在第一次用到时创建 ——
const layers = new Map()
function layer(ci) {
  if (layers.has(ci)) return layers.get(ci)
  const c = DATA.cards[ci]
  const el = document.createElement('div'); el.className = 'f'; el.innerHTML = c.html; el.style.display = 'none'
  stage.appendChild(el)
  const items = [...el.querySelectorAll('.new')]
  const span = c.reveal === 'spread' ? Math.max(0.6, c.speak * 0.85) : Math.min(0.6, 0.12 * items.length)
  const L = { el, items: items.map((node, i) => ({ node, at: items.length > 1 ? (span * i) / items.length : 0 })) }
  layers.set(ci, L); return L
}
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3))

function stepAt(time) {
  let lo = 0, hi = DATA.steps.length - 1
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (DATA.steps[mid].start <= time) lo = mid; else hi = mid - 1 }
  return lo
}

// —— 由时间算画面 ——
let shown = []
function render(time) {
  const sig = []
  const si = stepAt(time), step = DATA.steps[si], ci = step.card, local = time - DATA.cards[ci].start
  const vis = [ci]; if (ci > 0 && local < FADE) vis.push(ci - 1)
  for (const k of shown) if (!vis.includes(k)) layers.get(k).el.style.display = 'none'
  shown = vis
  const cur = layer(ci)
  cur.el.style.display = ''; cur.el.style.opacity = ci > 0 ? String(ease(local / FADE)) : '1'; cur.el.style.zIndex = '2'
  for (const it of cur.items) {
    const e = ease((local - it.at) / POP)
    sig.push(e.toFixed(3)); it.node.style.opacity = String(e); it.node.style.translate = e < 1 ? '0 ' + ((1 - e) * 8).toFixed(1) + 'px' : ''
  }
  sig.unshift(ci, cur.el.style.opacity)
  if (vis.length > 1) { const p = layer(ci - 1); sig.push('p'); p.el.style.display = ''; p.el.style.opacity = String(1 - ease(local / FADE)); p.el.style.zIndex = '1' }

  // 练习题
  const q = step.k === 'pause' ? step.quiz : -1
  if (q !== quizShown) showQuiz(q)
  if (exportMode && q >= 0) sig.push('q' + q, videoQuiz(step, time - step.start))

  // 字幕、进度、时间、当前屏
  $('cap').textContent = step.k === 'beat' ? step.text : ''
  let k = DATA.screens.findIndex((s) => time >= s.start && time < s.end)
  if (k < 0) k = DATA.screens.length - 1
  if (k !== scrIdx || !$('scr').textContent) {
    scrIdx = k
    $('scr').textContent = $('scr').title = DATA.screens[k].name
    $('next').hidden = k === DATA.screens.length - 1
    toc.querySelectorAll('button').forEach((b, i) => b.classList.toggle('cur', i === k))
  }
  DATA.screens.forEach((s, i) => { fill[i].style.width = Math.max(0, Math.min(1, (time - s.start) / (s.end - s.start))) * 100 + '%' })
  $('time').textContent = fmt(time) + ' / ' + fmt(DATA.total)
  return sig.join(',')
}

// 视频里的练习题：先倒计时"自己想想"，再揭晓正确选项和解析。返回这一刻的状态，供导出时判断画面变没变
let exportMode = false
function videoQuiz(step, local) {
  const Q = DATA.quizzes[step.quiz], left = Math.ceil(step.think - local), revealed = left <= 0
  let think = quizEl.querySelector('.think')
  if (!think) { think = document.createElement('div'); think.className = 'think'; quizEl.appendChild(think) }
  think.innerHTML = revealed ? '✓ 答案' : '⏸ 暂停一下，自己想想　<b>' + left + '</b>'
  think.classList.toggle('ans', revealed)
  quizEl.querySelectorAll('.qopt').forEach((b, i) => b.classList.toggle('right', revealed && Q.options[i].correct))
  quizEl.classList.toggle('done', revealed)
  return revealed ? 'r' : String(left)
}

// —— 练习题（网页里可作答；导出视频时只显示题面）——
let quizShown = -1, quizEl = null
function showQuiz(q) {
  quizShown = q
  if (quizEl) { quizEl.remove(); quizEl = null }
  if (q < 0) return
  const Q = DATA.quizzes[q], st = quizState[q]
  quizEl = document.createElement('div'); quizEl.className = 'quiz'
  const n = DATA.steps.filter((s) => s.k === 'pause').findIndex((s) => s.quiz === q) + 1
  quizEl.innerHTML = '<div class="qh">练习' + n + '　' + (Q.kind === 'multi' ? '多选' : '单选') + '</div><div class="qs">' + Q.stem + '</div>' +
    Q.options.map((o, i) => '<button class="qopt" data-i="' + i + '">' + o.html + '<div class="why">' + o.why + '</div></button>').join('') +
    '<div class="qex">' + Q.explain + '</div>' +
    '<div class="qbar"><span class="fb"></span><button class="ck">检查</button><button class="ans">看答案</button><button class="go">继续 ▶</button></div>'
  stage.appendChild(quizEl)
  const opts = [...quizEl.querySelectorAll('.qopt')], fb = quizEl.querySelector('.fb'), ck = quizEl.querySelector('.ck')
  const paint = () => {
    opts.forEach((b, i) => { b.classList.toggle('sel', st.sel.has(i) && !st.checked) })
    ck.disabled = st.sel.size === 0
    ck.textContent = st.checked && !st.right ? '再试一次' : '检查'
  }
  opts.forEach((b, i) => b.onclick = () => {
    if (st.checked) return
    if (Q.kind === 'single') st.sel = new Set([i]); else st.sel.has(i) ? st.sel.delete(i) : st.sel.add(i)
    paint()
  })
  ck.onclick = () => {
    if (st.checked) { st.checked = false; opts.forEach((b) => b.classList.remove('right', 'wrong')); fb.textContent = ''; st.sel.clear(); paint(); return }
    st.checked = true
    const wrong = [...st.sel].filter((i) => !Q.options[i].correct)
    const miss = Q.options.filter((o, i) => o.correct && !st.sel.has(i)).length
    st.right = wrong.length === 0 && miss === 0
    if (st.right) { reveal(); fb.textContent = '答对了。'; fb.className = 'fb ok' }
    else {
      wrong.forEach((i) => opts[i].classList.add('wrong'))
      fb.textContent = Q.kind === 'multi' ? '选错了 ' + wrong.length + ' 个' + (miss ? '，还有漏选的' : '') : '不对，再想想。'
      fb.className = 'fb no'
    }
    paint()
  }
  const reveal = () => { Q.options.forEach((o, i) => { if (o.correct) opts[i].classList.add('right') }); quizEl.classList.add('done') }
  quizEl.querySelector('.ans').onclick = () => { st.checked = true; st.right = true; reveal(); fb.textContent = ''; paint() }
  quizEl.querySelector('.go').onclick = () => { const s = DATA.steps.find((x) => x.k === 'pause' && x.quiz === q); waitingQuiz = -1; seek(s.end, playing) }
  paint()
}

// —— 播放：t 跟着音频走 ——
function stopAudio() { if (curAudio) { curAudio.pause(); curAudio = null } }
let last = 0
function tick(now) {
  const dt = last ? (now - last) / 1000 : 0; last = now
  if (playing) {
    const step = DATA.steps[stepAt(t)]
    if (step.k === 'pause') {
      stopAudio(); t = step.start; waitingQuiz = step.quiz
    } else {
      const a = audios.get(step.n), local = t - step.start
      if (curAudio !== a) { stopAudio(); warm(step.n); if (local < step.dur) { curAudio = a; a.currentTime = local; a.playbackRate = speed; a.play().catch(() => {}) } }
      // 以音频为准：服务器不支持分段请求时，中途跳转会从这一拍开头放起，画面也跟着回到拍首
      if (curAudio === a && !a.paused && !a.ended) { const at = step.start + a.currentTime; if (at > t || t - at > 0.3) t = at }
      else t += dt * speed
      if (t >= DATA.total) { t = DATA.total - 0.001; setPlaying(false); $('cover').hidden = false; $('startLabel').textContent = '↻ 重新播放'; if (window.__onEnded) window.__onEnded() }
    }
    render(t)
  }
  requestAnimationFrame(tick)
}
function setPlaying(p) { playing = p; $('play').classList.toggle('on', p); $('play').setAttribute('aria-label', p ? '暂停' : '播放'); if (!p) stopAudio() }
function seek(time, keepPlaying) {
  stopAudio(); t = Math.max(0, Math.min(DATA.total - 0.001, time)); render(t)
  if (keepPlaying !== undefined) setPlaying(keepPlaying)
}
function jumpBeat(dir) {
  const i = beats.findIndex((s) => s.start > t + 0.001)
  const cur = (i < 0 ? beats.length : i) - 1
  let k = dir > 0 ? cur + 1 : (cur >= 0 && t - beats[cur].start > 1 ? cur : cur - 1)
  k = Math.max(0, Math.min(beats.length - 1, k)); seek(beats[k].start, playing)
}

$('start').onclick = () => { $('cover').hidden = true; if (t >= DATA.total - 0.01) t = 0; setPlaying(true) }
$('play').onclick = () => { $('cover').hidden = true; setPlaying(!playing) }
// 倍速：点一下换下一档
const SPEEDS = [0.8, 1, 1.25, 1.5]
$('speed').onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('speed').textContent = speed + '×'
  if (curAudio) curAudio.playbackRate = speed
}
const toggleCap = () => {
  const on = $('capOn').getAttribute('aria-pressed') !== 'true'
  $('capOn').setAttribute('aria-pressed', String(on)); $('cap').classList.toggle('off', !on)
}
$('capOn').onclick = toggleCap
$('menu').onclick = (e) => { e.stopPropagation(); toc.hidden = !toc.hidden; $('menu').setAttribute('aria-expanded', String(!toc.hidden)) }
document.addEventListener('click', (e) => { if (!toc.hidden && !toc.contains(e.target)) closeToc() })
$('startLabel').textContent = '开始播放 · ' + fmt(DATA.total)
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return
  if (e.key === ' ') { e.preventDefault(); $('cover').hidden = true; setPlaying(!playing) }
  else if (e.key === 'ArrowLeft') jumpBeat(-1)
  else if (e.key === 'ArrowRight') jumpBeat(1)
  else if (e.key === 'c' || e.key === 'C') toggleCap()
  else if (e.key === 'Escape') closeToc()
})

// —— 画布缩放 ——
// 嵌入网站时整屏只有这一页：先按宽、高两个方向算出舞台最大能多大（扣掉控制条、字幕和留白），再按舞台宽度缩放画布
const fullscreen = () => document.body.classList.contains('embed')
function fitWrap() {
  if (!fullscreen()) { wrap.style.width = ''; return }
  const main = document.querySelector('main'), cs = getComputedStyle(main), dock = $('dock'), cap = $('cap')
  const px = (v) => parseFloat(v) || 0
  const w = main.clientWidth - px(cs.paddingLeft) - px(cs.paddingRight)
  const h = innerHeight - px(cs.paddingTop) - px(cs.paddingBottom) - dock.offsetHeight - px(getComputedStyle(dock).marginTop) - cap.offsetHeight - px(getComputedStyle(cap).marginTop)
  wrap.style.width = Math.max(160, Math.floor(Math.min(w, (h * 16) / 9))) + 'px'
}
const fit = () => { stage.style.transform = 'scale(' + wrap.clientWidth / 640 + ')' }
new ResizeObserver(fit).observe(wrap); fit()

// —— 导出视频用：给定秒数，画出那一刻（不放声音）——
window.__duration = DATA.total
window.__seek = (time) => { exportMode = true; document.body.classList.add('export'); $('cover').hidden = true; setPlaying(false); t = time; return render(time) }

// —— 风格切换：带上当前秒数，到新页面接着放 ——
document.querySelectorAll('.sty a').forEach((a) => a.onclick = (e) => { e.preventDefault(); location.href = a.getAttribute('href') + '?t=' + t.toFixed(2) })
// —— 贴纸版的色系（记在 localStorage）——
const pal = $('pal')
if (pal) {
  const set = (v) => { document.documentElement.dataset.palette = v; pal.value = v }
  const saved = localStorage.getItem('course-palette'); if (saved && [...pal.options].some((o) => o.value === saved)) set(saved)
  pal.onchange = () => { set(pal.value); localStorage.setItem('course-palette', pal.value) }
}

const params = new URLSearchParams(location.search)
const t0 = parseFloat(params.get('t'))
if (t0 > 0 && t0 < DATA.total) { t = t0; $('startLabel').textContent = '接着播放 · ' + fmt(t) + ' / ' + fmt(DATA.total) }
// —— 嵌入网站节页（?embed）：全屏学习层。告诉外层页面：播完了、要退出、要改读文字、要问 AI；外层可以让它重新播放、暂停 ——
if (params.has('embed') && window.parent !== window) {
  document.body.classList.add('embed')
  const post = (msg) => window.parent.postMessage(Object.assign({ source: 'ds-course' }, msg), '*')
  window.__onEnded = () => post({ type: 'ended' })
  $('exit').onclick = () => post({ type: 'exit' })
  $('toText').onclick = () => { setPlaying(false); post({ type: 'text' }) }
  $('ask').onclick = () => { setPlaying(false); post({ type: 'ask' }) }
  // Esc：目录开着先关目录，否则退出
  // 捕获阶段先于上面关目录的那个监听器，才能看到按下时目录是不是开着
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && toc.hidden) post({ type: 'exit' }) }, true)
  window.addEventListener('message', (e) => {
    const d = e.data
    if (e.source !== window.parent || !d || d.source !== 'ds-site') return
    if (d.type === 'replay') { t = 0; $('start').click() }
    else if (d.type === 'pause') setPlaying(false)
  })
  addEventListener('resize', fitWrap); fitWrap()
}
render(t); requestAnimationFrame(tick)
</script>
</body></html>
