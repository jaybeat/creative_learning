<style>/* —— 画布与画面元素（640×360） —— */
.f,.f *{box-sizing:border-box}
.f{width:640px;height:360px;position:relative;background:#fafaf8;color:#333;overflow:hidden;font-size:14px}
.abs{position:absolute}.rel{position:relative}
.t{position:absolute;left:24px;top:14px;font-size:20px;font-weight:700}
.new{outline:3px solid #f08c00!important;outline-offset:2px}
.hl{background:#ffe8cc!important}
.dim{opacity:.35}
.note{font-size:13px;color:#777}
.mini{font-size:11px;color:#999}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#e9ecef;font-size:13px;margin-right:6px}
.tag.big{font-size:18px;padding:4px 14px;background:#d0ebff}
.ed{display:inline-block;border:2px solid #999;border-radius:6px;padding:4px 12px;font:22px/1.4 Consolas,monospace;background:#fff;min-width:130px;margin-right:8px;vertical-align:top}
.ed.big{font-size:30px;min-width:220px}.ed.sm{font-size:15px;min-width:64px;padding:2px 8px}
.ed.flash{box-shadow:0 0 0 3px #d0ebff}
.cur{color:#e03131;font-weight:700}
.inp{border:2px solid #bbb;border-radius:20px;padding:6px 16px;width:280px;background:#fff;font-size:16px}
.keys .key{display:inline-block;border:2px solid #888;border-bottom-width:4px;border-radius:5px;width:36px;text-align:center;font:18px Consolas,monospace;margin-right:8px;background:#fff}
.cells{display:flex;align-items:center}
.cell{border:2px solid #777;display:flex;align-items:center;justify-content:center;font:20px Consolas,monospace;background:#fff;margin-left:-2px;position:relative}
.cells.gap .cell{margin-left:0}
.ct{position:absolute;top:-19px;font-size:11px;color:#555;white-space:nowrap;font-family:sans-serif}
.ci{position:absolute;bottom:-19px;font-size:11px;color:#888;white-space:nowrap;font-family:sans-serif}
.arr{margin:0 6px;color:#555;font-size:18px}
.brace{font:13px Consolas,monospace;color:#555}
.dash{border:2px dashed #999;border-radius:8px;padding:12px;position:relative}
.dl{position:absolute;right:-48px;top:18px;font-size:14px;color:#666}
.gear{font-size:44px;text-align:center;line-height:1}.gear div{font-size:14px}
.goal{font-size:16px;text-align:center;line-height:1.8}
.qc{background:#fff;border:2px solid #4dabf7;border-radius:8px;padding:6px 12px;font-size:14px;width:340px}
.qc .qh{font-weight:700;color:#1971c2}.qc ol{margin:4px 0 0;padding-left:20px}.qc li{margin:2px 0}
.qc li.on{background:#ffe8cc;border-radius:3px}.qc li.ok{color:#2b8a3e}
.qc.big{font-size:20px;width:380px}
.qc.mid{width:220px}
.qc.corner{position:absolute;right:10px;top:10px;width:190px;font-size:10px;padding:4px 8px}
.okm{color:#2b8a3e;margin-left:6px}.nom{color:#c92a2a;margin-left:6px}.okm.big{font-size:22px}
.acc{width:360px}
.row{border:1.5px solid #ccc;border-radius:6px;background:#fff;margin-bottom:4px;padding:3px 10px;display:flex;align-items:center;gap:10px;min-height:24px;font-size:13px}
.row .rn{font-weight:700;width:80px;flex:none}.row .rs{color:#555;font-family:Consolas,monospace}
.row.open{display:block;border-color:#888}.row.open .rn{margin-bottom:2px}
.card{background:#fff;border:1.5px solid #bbb;border-radius:8px;padding:8px 12px}
.card .ch{font-weight:700;margin-bottom:6px}
.log .lr{border:1px solid #ddd;border-radius:4px;padding:1px 8px;font-size:12px;background:#f8f9fa}
.log .la{text-align:center;font-size:10px;line-height:10px;color:#888}
.checks{position:absolute;bottom:10px;left:12px;right:12px}
.card{position:relative}
.ck{border:1px solid #ddd;border-radius:4px;padding:1px 8px;margin-top:3px;font-size:12px;background:#fff}
.tree text{font-size:12px;text-anchor:middle;fill:#333}.tree .nd{fill:#fff;stroke:#888}.tree line{stroke:#888;stroke-width:1.5}
.tree .hl line{stroke:#f08c00;stroke-width:3}
.cands div{margin-bottom:3px}.cands .ed{padding:0 8px}.strike .ed{text-decoration:line-through}
.neq{font-size:30px;margin:0 10px;color:#c92a2a;vertical-align:middle}
.bounce{display:inline-block;border:1px dashed #c92a2a;border-radius:4px;padding:2px 8px;margin-right:8px;color:#c92a2a}
.counter{font:16px Consolas,monospace;padding:2px 8px;display:inline-block}
.qz-h{font-weight:700;color:#1971c2;margin-bottom:4px}.qz-s{font-size:12px;color:#555;margin-bottom:4px}
.opt{border:1px solid #ddd;border-radius:4px;padding:1px 8px;margin:3px 0;font-size:12px}
.btns{text-align:right;margin-top:4px}.btn{display:inline-block;background:#dee2e6;border-radius:4px;padding:1px 14px;font-size:12px}
.pts{margin:6px 0}
.pause{position:absolute;inset:0;background:rgba(255,248,230,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:#a06000}
.pause .pi{font-size:46px}

body{margin:0;background:#eceae4;font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;color:#333}
main{max-width:980px;margin:0 auto;padding:16px}
/* 底部控制区（照抖音/B站）：上面一条按每屏时长分段的进度线，下面一行按钮 */
.dock{position:relative;margin-top:6px}
.bar{display:flex;align-items:center;gap:10px;height:40px}
#time{flex:none;font-size:13px;color:#666;font-variant-numeric:tabular-nums}
/* 屏名就是目录按钮（照 YouTube 章节名）：☰ 屏名 ▾，点开从左下往上弹出全部屏 */
.nav{flex:0 1 auto;min-width:0;position:relative}
#menu{max-width:100%;gap:6px;padding:0 8px 0 6px;font-weight:400}
#scr{min-width:0;font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{flex:none;font-size:10px;opacity:.55}
#next{flex:none;font-weight:400}
#next[hidden]{display:none}
#prog{display:flex;gap:3px;align-items:center;height:16px}
.seg{min-width:6px;height:16px;display:flex;align-items:center;cursor:pointer}
.seg b{display:block;position:relative;width:100%;height:4px;border-radius:2px;background:#ddd;overflow:hidden;transition:height .12s}
#prog:hover .seg b{height:6px}
.seg i{position:absolute;left:0;top:0;bottom:0;background:#222}
.tools{flex:none;display:flex;align-items:center;gap:2px;position:relative;margin-left:auto}
.ib{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#333;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font:600 13px/1 inherit}
.ib:hover{background:rgba(0,0,0,.06)}
.ib svg{width:20px;height:20px}
.ib .i-pause,.ib.on .i-play{display:none}.ib.on .i-pause{display:block}
.ib.txt{width:auto;min-width:32px;padding:0 6px}
#capOn[aria-pressed=true]{background:#e4ecf6;color:#0e3061}
/* 目录从屏名按钮向上弹出：开始时间 + 屏名，当前屏加粗带"▶" */
#toc{position:absolute;left:0;bottom:38px;z-index:30;background:#fff;border:1px solid #ddd;border-radius:12px;padding:6px;min-width:260px;max-width:min(420px,90vw);max-height:60vh;overflow:auto;box-shadow:0 -10px 30px -10px rgba(0,0,0,.25)}
#toc[hidden],#tip[hidden]{display:none}
#toc button{display:flex;width:100%;gap:12px;border:0;background:none;padding:7px 10px;border-radius:8px;font:13px/1.4 inherit;cursor:pointer;color:inherit;text-align:left}
#toc button:hover{background:rgba(0,0,0,.05)}#toc button.cur{font-weight:700}
#toc em{flex:none;width:3em;font-style:normal;opacity:.55;font-variant-numeric:tabular-nums}
#toc button.cur em{opacity:1}
#toc button.cur em::before{content:"▶ ";font-size:9px;vertical-align:1px}
#tip{position:absolute;top:-30px;transform:translateX(-50%);background:#222;color:#fff;font-size:12px;line-height:1.5;padding:3px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:31}
#pal{font:inherit;font-size:12px;margin-left:6px}
/* 嵌入网站节页：全屏学习层（网站 CourseSwitch.vue 把 iframe 铺满视口）。左上角 ×，中间舞台 + 字幕，底部控制区贴着视口下沿；舞台按宽高两个方向缩放（fit） */
.emb{display:none!important}
body.embed .emb{display:inline-flex!important}
body.embed{background:transparent!important;overflow:hidden}
body.embed.th-clean{background:var(--page)!important}
body.embed main{max-width:none!important;box-sizing:border-box;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 24px 6px!important}
body.embed .wrap{flex:none;margin:auto auto 0}
body.embed #cap{flex:none;margin:14px auto auto}
body.embed .dock{flex:none;box-sizing:border-box;margin-left:auto;margin-right:auto;max-width:100%}
#fs .i-fs-off,body.fs #fs .i-fs-on{display:none}body.fs #fs .i-fs-off{display:block}
#fs[hidden]{display:none}
/* 真全屏（浏览器全屏接口）：四周不留白，控制区叠在画面底边上（bottom 由 fitWrap 算），播放时鼠标不动 2.5 秒就淡出；字幕仍在画面下方，不被压住 */
body.fs main{max-width:none!important;box-sizing:border-box;height:100vh;display:flex;flex-direction:column;padding:0 0 4px!important}
body.fs .wrap{flex:none;margin:auto auto 0;border-radius:0!important;border:0!important}
body.fs #cap{flex:none;margin:10px auto auto}
body.fs .dock{position:fixed;left:0;right:0;bottom:0;width:auto!important;margin:0;padding:22px 24px 2px;z-index:35;transition:opacity .25s;
  background:linear-gradient(transparent,color-mix(in srgb,var(--stage,#fafaf8) 92%,transparent) 40%)}
body.fs.idle .dock{opacity:0;pointer-events:none}
body.fs.idle{cursor:none}
body.fs #exit{display:none!important}
@media (max-width:640px){body.embed main{padding:8px 10px 4px!important}.bar{gap:6px}#scr,.caret,#speed{display:none}}
@media (max-width:400px){#time{display:none}}
.wrap{position:relative;box-sizing:border-box;width:100%;aspect-ratio:16/9;background:#fafaf8;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.stage{position:absolute;left:0;top:0;width:640px;height:360px;transform-origin:0 0}
.stage .f{position:absolute;left:0;top:0}
.player .new{outline:none!important}
.f .pause{display:none}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(250,250,248,.85);z-index:20}
.cover[hidden]{display:none}
.cover button{display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:none;cursor:pointer;color:#555;font:14px/1.4 inherit;padding:0}
.cover .big{width:64px;height:64px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center}
.cover .big svg{width:28px;height:28px;margin-left:3px}
#cap{min-height:3.2em;max-width:80%;margin:14px auto 0;font-size:17px;line-height:1.6;text-align:center;color:#222}
#cap.off{visibility:hidden}
.quiz{position:absolute;inset:12px;background:#fff;border:1.5px solid #bbb;border-radius:10px;padding:10px 16px;overflow:auto;font-size:13px;z-index:5}
.quiz .qh{font-weight:700;color:#1971c2}
.quiz .qs{margin:2px 0 6px;color:#444}
.qopt{display:block;width:100%;text-align:left;border:1px solid #ccc;border-radius:6px;padding:3px 10px;margin:3px 0;background:#fff;cursor:pointer;font:inherit;color:inherit}
.qopt.sel{border-color:#1971c2;background:#e7f5ff}
.qopt.right{border-color:#2b8a3e;background:#ebfbee}
.qopt.wrong{border-color:#c92a2a;background:#fff5f5}
.qopt .why{display:none;font-size:11px;color:#666}
.qopt.right .why,.qopt.wrong .why{display:block}
.qbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:6px}
.qbar .fb{margin-right:auto;font-weight:700}
.qbar .fb.ok{color:#2b8a3e}.qbar .fb.no{color:#c92a2a}
.qbar button{font:inherit;padding:2px 14px;border-radius:5px;border:1px solid #bbb;background:#f1f3f5;cursor:pointer}
.qbar button.go{background:#1971c2;color:#fff;border-color:#1971c2}
.qbar button:disabled{opacity:.4;cursor:default}
.qex{display:none;font-size:12px;color:#555;margin-top:4px}
.quiz.done .qex{display:block}
.export .qbar button{display:none}
.export .quiz{padding:8px 14px}
.export .qopt{padding:2px 10px;margin:2px 0}
.export .qopt.right .why{display:inline;margin-left:10px}
.export .think{margin-top:6px;padding:4px 12px}
.export .qex{margin-top:2px}
.think{margin-top:8px;padding:6px 12px;border-radius:8px;background:#fff3bf;color:#a06000;font-size:15px;text-align:center}
.think b{font-size:20px;margin-left:6px}
.think.ans{background:#ebfbee;color:#2b8a3e}
/* 填空题：空位和选项块（质感版的样式在 scripts/lib/clean.ts，和例题的空位共用）；这里是其他风格的底子 */
.fq .qs p{margin:0 0 4px}.fq .qs ul,.fq .qs ol{margin:0;padding-left:20px}.fq .qs li{margin:6px 0}
.fq .qs pre{margin:4px 0;font-size:12px}
.fq .qex p{margin:0 0 4px}
.c-blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;box-sizing:border-box;min-width:64px;min-height:26px;margin:0 3px;padding:2px;border:1px dashed #bbb;border-radius:8px;background:#f1f3f5;font:inherit;color:inherit}
.c-fill{display:inline-block;border:1px solid #ccc;border-radius:6px;background:#fff;padding:0 10px;line-height:20px;white-space:nowrap;font:inherit;color:inherit}
.fq-b{cursor:pointer}.fq.locked .fq-b{cursor:default}
.fq-b.is-picked{border-style:solid;border-color:#1971c2}
.fq-b.is-wrong .c-fill{color:#999;text-decoration:line-through}
.fq-b.is-right .c-fill{border-color:#2b8a3e}
.fq-opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.fq-o{cursor:grab}
.fq-o.picked{border-color:#1971c2;box-shadow:inset 0 0 0 1px #1971c2}
.fq-o:disabled{opacity:.35;cursor:default}
.qbar button[hidden]{display:none}

.th-clean .dim{opacity:.4}
.th-clean .hl{background:var(--c1-soft)!important;color:var(--c1)}
.th-clean .tag{background:var(--paper);border:1px solid var(--line-soft);border-radius:999px;padding:1px 10px;font-size:12.5px;line-height:1.6}
.th-clean .tag.big{background:var(--c1-soft);color:var(--c1);border-color:transparent;font-weight:600;font-size:16px;padding:3px 14px}
.th-clean .ed{border:1px solid var(--line-cell);border-radius:8px;font-family:"CleanMono",Consolas,monospace;background:var(--paper);color:var(--ink-strong);line-height:1.4}
.th-clean .ed.flash{box-shadow:0 0 0 3px var(--c1-soft)}
.th-clean .cur{color:var(--caret);font-weight:400}
.th-clean .inp{border:1px solid var(--line-cell);border-radius:999px;background:var(--paper);font-size:15px}
.th-clean .keys .key{border:1px solid var(--line-cell);border-bottom-width:2px;border-radius:6px;font-family:"CleanMono",Consolas,monospace;background:var(--paper)}
.th-clean .cell{border:1px solid var(--line-cell);font-family:"CleanMono",Consolas,monospace;background:var(--paper);color:var(--ink-strong);margin-left:-1px}
/* 格子分三层画法：默认是逻辑画法（分开的方块，只说谁在第几个）；.mem 是顺序表（共边连续，下面标地址）；链表用 .c-node */
.th-clean .cells .cell{margin:0 8px 0 0;border-radius:6px}
.th-clean .cells .cell:last-child,.th-clean .cells.gap .cell{margin-right:0}
.th-clean .cells.mem .cell{margin:0 0 0 -1px;border-radius:0}
.th-clean .cell.new{z-index:1}
.th-clean .cells.mem .cell:first-child{border-radius:6px 0 0 6px}
.th-clean .cells.mem .cell:last-child{border-radius:0 6px 6px 0}
.th-clean .cells.mem .ci{font-family:"CleanMono",Consolas,monospace}
.th-clean .ct{font-size:12px;color:var(--mute);font-family:"CleanSans","Microsoft YaHei","PingFang SC",sans-serif;top:-21px}
.th-clean .ci{font-size:12px;color:var(--faint);font-family:"CleanSans","Microsoft YaHei","PingFang SC",sans-serif;bottom:-21px}
.th-clean .arr{color:var(--faint);font-size:15px}
.th-clean .brace,.th-clean .counter{font-family:"CleanMono",Consolas,monospace;color:var(--mute)}
.th-clean .dash{border:1px dashed var(--dash);border-radius:10px}
.th-clean .dl{color:var(--mute)}
.th-clean .okm{color:var(--ok)}
.th-clean .nom{color:var(--off)}
.th-clean .neq{color:var(--mute)}
.th-clean .bounce{border:1px dashed var(--dash);border-radius:999px;color:var(--off);text-decoration:line-through}
.th-clean .strike .ed{text-decoration:line-through;color:var(--off)}
/* 问题卡：大卡发丝框；角落小卡只留当前那一问，做成小标签 */
.th-clean .qc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.th-clean .qc .qh{color:var(--warm);font-size:12px;font-weight:600}
.th-clean .qc li.on{background:var(--c1-soft);color:var(--c1);border-radius:4px}
.th-clean .qc li.ok{color:var(--ok)}
.th-clean .qc.corner{right:16px;top:16px;width:auto;max-width:300px;border:0;border-radius:999px;background:var(--warm-soft);color:var(--warm);padding:1px 10px;font-size:12px;font-weight:500}
.th-clean .qc.corner .qh{display:none}
.th-clean .qc.corner ol{margin:0;padding:0;list-style:none}
.th-clean .qc.corner li{display:none;margin:0;background:none;color:inherit}
.th-clean .qc.corner li.on{display:block}
.th-clean .qc.corner li:nth-child(1).on::before{content:"问题 1 · "}
.th-clean .qc.corner li:nth-child(2).on::before{content:"问题 2 · "}
.th-clean .qc.corner li:nth-child(3).on::before{content:"问题 3 · "}
/* 手风琴：1px 淡线，展开行不加深；行名 600；结果用等宽 */
.th-clean .row{border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:13px}
.th-clean .row .rn{font-weight:600}
.th-clean .row .rs{color:var(--mute);font-family:"CleanMono",Consolas,monospace}
.th-clean .row.open{border-color:var(--line)}
/* 卡片：1px 淡线；卡片标题变成类别色标签（例题的左右两张卡各一种颜色）；"正在讲的"卡只换线色，不填色 */
.th-clean .card{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.th-clean .card.hl{background:var(--paper)!important;border-color:var(--c1-line);color:var(--ink)}
.th-clean .card .ch{display:inline-block;font-weight:600;font-size:12.5px;padding:0 10px;border-radius:999px;background:var(--btn);margin-bottom:8px}
.th-clean .f>.abs:nth-child(2)>.card>.ch{background:var(--c1-soft);color:var(--c1)}
.th-clean .f>.abs:nth-child(3)>.card>.ch{background:var(--c2-soft);color:var(--c2)}
.th-clean .log .lr{border:1px solid var(--line-soft);border-radius:8px;background:var(--paper);font-size:12px}
.th-clean .log .la{color:var(--faint);font-size:12px;line-height:11px}
/* 检查行：一行一框改成行内胶囊加勾叉；错的那个变灰加划线 */
.th-clean .checks{display:flex;flex-wrap:wrap;gap:6px}
.th-clean .ck{margin:0;border:1px solid var(--line-soft);border-radius:999px;padding:0 10px;font-size:12px;background:var(--paper)}
.th-clean .ck:has(.nom){color:var(--off);text-decoration:line-through}
.th-clean .tree text{fill:var(--ink);font-family:"CleanSans","Microsoft YaHei","PingFang SC",sans-serif}
.th-clean .tree .nd{fill:var(--paper);stroke:var(--line-cell)}
.th-clean .tree line{stroke:var(--line-cell)}
.th-clean .tree .hl{background:none!important}
.th-clean .tree .hl line{stroke:var(--c1);stroke-width:1.5}
/* 练习卡 */
.th-clean .qz-h{display:inline-block;background:var(--warm-soft);color:var(--warm);border-radius:6px;padding:0 8px;font-size:12px;font-weight:600}
.th-clean .qz-s{font-size:13px;color:var(--ink);font-weight:500}
.th-clean .opt{border:1px solid var(--line);border-radius:10px;font-size:12.5px;background:var(--paper)}
.th-clean .btn{background:var(--btn);border-radius:999px;padding:1px 22px;font-size:12px}
.th-clean .pause{background:color-mix(in srgb,var(--stage) 82%,transparent);color:var(--warm);font-size:14px}

/* —— 重排版（<id>.clean.frames.ts）才用的元素，kit 里的 c* 函数 —— */
.th-clean .c-kick{display:inline-block;background:var(--warm-soft);color:var(--warm);border-radius:999px;padding:0 10px;font-size:12px;font-weight:500;line-height:1.7}
.th-clean .c-title{font-family:"CleanSerif","Songti SC","SimSun",serif;font-weight:700;font-size:19px;color:var(--ink-strong);line-height:1.4;white-space:nowrap}
.th-clean .c-q{font-family:"CleanSerif","Songti SC","SimSun",serif;font-weight:600;font-size:16px;color:var(--ink-strong);line-height:1.5}
.th-clean .c-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-soft);border-radius:999px;padding:1px 11px;background:var(--paper);font-size:12.5px;line-height:1.7;margin:0 6px 6px 0}
.th-clean .c-chip.mono{font-family:"CleanMono",Consolas,monospace;font-size:15px;color:var(--ink-strong);padding:2px 13px}
.th-clean .c-chip.off{color:var(--off);text-decoration:line-through}
.th-clean .c-label{display:inline-block;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:600;line-height:1.8}
.th-clean .c-label.c1{background:var(--c1-soft);color:var(--c1)}
.th-clean .c-label.c2{background:var(--c2-soft);color:var(--c2)}
.th-clean .c-badge{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;background:var(--c1-soft);color:var(--c1);line-height:1.7}
.th-clean .c-slot{display:inline-block;border:1px dashed var(--dash);border-radius:8px;color:var(--faint);font-size:12px;padding:0 10px;line-height:1.8}
.th-clean .c-tbl{display:flex;flex-direction:column;gap:6px}
.th-clean .c-row{border:1px solid var(--line);border-radius:10px;background:var(--paper);display:flex;align-items:center;min-height:30px;padding:0 14px}
.th-clean .c-row .rn{font-weight:600;width:84px;flex:none}
.th-clean .c-row .rs{color:var(--mute);font-family:"CleanMono",Consolas,monospace}
.th-clean .c-row.open{align-items:flex-start;padding:10px 14px}
.th-clean .c-row.open .rn{padding-top:2px}
.th-clean .c-row.open>.rel{flex:1}
.th-clean .c-tuple{font-size:15px;color:var(--ink-strong)}
.th-clean .c-bag{display:inline-flex;border:1px dashed var(--dash);border-radius:14px;padding:5px 2px 0 8px}
.th-clean .cands-row{display:flex;gap:10px}
.th-clean .cands-row .ed{padding:0 8px;margin-right:4px}
.th-clean .qm{color:var(--faint);font-weight:500}
.th-clean .c-checks{position:absolute;left:14px;right:14px;bottom:8px}
.th-clean .c-tree{margin-top:8px}
.th-clean .card .log{margin-top:8px}
.th-clean .c-opts{display:grid;grid-template-columns:274px 274px;grid-auto-flow:column;grid-template-rows:repeat(4,30px);gap:6px 12px}
.th-clean .c-opt{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--paper);height:30px;padding:0 12px;font-size:12.5px}
.th-clean .c-opt b{font-weight:500;color:var(--mute);width:16px;margin-right:10px;border-right:1px solid var(--line);flex:none}
.th-clean .c-btn{display:inline-block;background:var(--btn);color:var(--mute);border-radius:10px;padding:3px 0;width:160px;text-align:center;font-size:12.5px}
.th-clean .c-btn.ghost{background:var(--paper);border:1px solid var(--line-soft);width:auto;padding:3px 14px;color:var(--ink)}
.th-clean .c-cap{font-size:12.5px;color:var(--mute)}
.th-clean .c-down{color:var(--faint);font-size:12px;line-height:12px;text-align:center}
.th-clean .tuple{font-family:"CleanMono",Consolas,monospace}
.th-clean .c-brace{border:1px solid var(--faint);border-top:0;height:8px;border-radius:0 0 4px 4px;position:relative}
.th-clean .c-brace span{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12.5px;color:var(--mute)}
.th-clean .c-big{font-family:"CleanSerif","Songti SC","SimSun",serif;font-weight:700;font-size:26px;color:var(--ink-strong);margin-top:4px}
.th-clean .c-opts1{display:flex;flex-direction:column;gap:6px;width:560px}
.th-clean .c-tick{margin-left:auto}
.th-clean .card .pts{margin:8px 0}
.th-clean .gear{color:var(--mute)}
.th-clean .qc.big{width:380px;font-size:19px;padding:12px 18px}
.th-clean .qc.mid{width:200px}
.th-clean .c-node{display:inline-flex;border:1px solid var(--line-cell);border-radius:6px;background:var(--paper);font-family:"CleanMono",Consolas,monospace;font-size:18px;color:var(--ink-strong);position:relative}
.th-clean .c-node span{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.th-clean .c-node span+span{width:48px;border-left:1px solid var(--line-cell);font-size:14px;color:var(--mute)}
.th-clean .c-node em{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-style:normal;font-size:12px;color:var(--faint)}
.th-clean .c-link{display:inline-block;width:34px;border-top:1.5px solid var(--faint);position:relative;vertical-align:middle;margin:0 2px}
.th-clean .c-link::after{content:"";position:absolute;right:-1px;top:-5px;border:4.5px solid transparent;border-left:7px solid var(--faint);border-right:0}
/* 第1屏左右两栏：左边五行要点（行高固定，讲到的行高亮），右边演示卡（位置固定，内容原位换） */
.th-clean .c-list{display:flex;flex-direction:column;gap:6px;width:196px}
.th-clean .c-li{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:4px 12px;display:flex;flex-direction:column;justify-content:flex-start;position:relative}
.th-clean .c-li .rn{font-weight:600;font-size:13px;line-height:1.45}
.th-clean .c-li .rs{font-family:"CleanMono",Consolas,monospace;font-size:12px;color:var(--mute);line-height:1.45;white-space:nowrap}
.th-clean .c-li.on{background:var(--c1-soft);border-color:transparent}
.th-clean .c-li.on .rn{color:var(--c1)}
.th-clean .c-li .c-tick{position:absolute;right:10px;top:10px;margin:0}
.th-clean .c-panel{width:348px;height:244px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 16px}
.th-clean .c-panel .ph{font-size:12px;font-weight:600;color:var(--mute)}
/* 第0屏：场景图（屏幕拼贴）、历史条、问题胶囊 */
.th-clean .c-scr{position:relative;width:280px;height:160px;border:1px solid var(--line-cell);border-radius:12px;background:var(--paper);overflow:hidden}
.th-clean .c-scr .bar{height:14px;border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding-left:8px}
.th-clean .c-scr .bar i{width:6px;height:6px;border-radius:50%;background:var(--line-cell)}
.th-clean .c-scr .ui{position:absolute}
.th-clean .c-scr .in{border:1px solid var(--line-cell);border-radius:999px;padding:0 8px;font-size:12px;line-height:22px;height:24px;background:var(--paper);white-space:nowrap;color:var(--ink)}
.th-clean .c-scr .in.sq{border-radius:4px}
.th-clean .c-scr .pane{border:1px solid var(--line);border-radius:8px;background:var(--stage)}
.th-clean .c-scr .hd{font-size:12px;color:var(--mute);line-height:18px}
.th-clean .c-scr .bub{font-size:12px;line-height:20px;height:20px;padding:0 8px;border-radius:10px;background:var(--btn);white-space:nowrap}
.th-clean .c-scr .bub.me{background:var(--c1-soft);color:var(--c1)}
.th-clean .c-scr .doc{width:28px;height:36px;border:1px solid var(--line-cell);border-radius:2px 9px 2px 2px;background:var(--paper)}
/* 封面标题区：只用在封面屏，居中；其他屏一律左上 (40,16)/(40,44) */
.th-clean .c-cover{width:640px;text-align:center}
.th-clean .c-cover .c-kick{margin-bottom:4px}
.th-clean .c-sub{font-size:13px;color:var(--mute);margin-top:4px}
.th-clean .c-hist{display:flex;gap:6px}
.th-clean .c-hist .ed{min-width:0;padding:0 8px;margin:0;font-size:14px}
.th-clean .c-qp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:2px 14px 2px 3px;font-size:14px;color:var(--ink);white-space:nowrap}
.th-clean .c-qp b{width:24px;height:24px;border-radius:50%;background:var(--btn);color:var(--mute);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-right:10px}
.th-clean .c-qp.on{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.th-clean .c-qp.on b{background:var(--paper);color:var(--warm)}
/* 对比页开关：正文改纯黑、元组改衬线斜体（标题已定宋体） */
.ink-black .th-clean{--ink:var(--ink-strong)}
.tuple-serif .th-clean .tuple,.tuple-serif .th-clean .row .rs,.tuple-serif .th-clean .c-row .rs{font-family:"CleanSerif","Songti SC","SimSun",serif;font-style:italic}

/* —— 空位：例题和填空练习共用 —— */
.th-clean .c-blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;box-sizing:border-box;min-width:64px;min-height:28px;margin:0 3px;padding:2px;border:1px dashed var(--line-cell);border-radius:10px;background:var(--btn);font:inherit;color:inherit}
.th-clean .c-fill{display:inline-block;border:1px solid var(--line-cell);border-radius:8px;background:var(--paper);padding:0 10px;font-family:"CleanMono",Consolas,monospace;font-size:13px;line-height:22px;color:var(--ink-strong);white-space:nowrap}
.th-clean .c-steps{display:grid;grid-template-columns:auto auto auto;gap:6px 6px;align-items:center;justify-content:start}
.th-clean .c-steps .sa{font-size:12.5px;color:var(--ink);padding-right:6px;white-space:nowrap}
.th-clean .c-steps .c-blank{margin:0}
/* 填空练习（播放器）：空位可以点、可以拖进去 */
.th-clean .quiz.fq .qs{color:var(--ink)}
.th-clean .fq-b{cursor:pointer}
.th-clean .fq.locked .fq-b{cursor:default}
.th-clean .fq-b.is-picked{border-style:solid;border-color:var(--c1-line);background:var(--c1-soft)}
.th-clean .fq-b.is-wrong .c-fill{color:var(--off);text-decoration:line-through;border-color:var(--line-soft)}
.th-clean .fq-b.is-right .c-fill{background:var(--c1-soft);color:var(--c1);border-color:transparent}
.th-clean .fq-o{cursor:grab;font-size:13px}
.th-clean .fq-o:hover:not(:disabled){border-color:var(--c1-line)}
.th-clean .fq-o.picked{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.th-clean .fq-o:disabled{opacity:.35;cursor:default}

/* —— 练习卡：按钮条、解析位、选项的作答状态 —— */
.th-clean .c-qbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;width:560px;height:30px}
.th-clean .c-qbar .fb{margin-right:auto;font-size:13px;font-weight:600;color:var(--mute)}
.th-clean .c-qbar .fb.ok{color:var(--c1)}
.th-clean .c-qbar button{font:inherit;font-size:12.5px;line-height:1;height:30px;padding:0 16px;border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.th-clean .c-qbar button.ck{min-width:120px;background:var(--btn);border-color:transparent}
.th-clean .c-qbar button.go{background:var(--ink-strong);border-color:transparent;color:var(--paper)}
.th-clean .c-qbar button:disabled{color:var(--faint);cursor:default}
.th-clean .c-qbar button[hidden]{display:none}
.th-clean .c-qbar .think{margin:0 0 0 auto;padding:4px 14px;border-radius:10px;background:var(--c1-soft);color:var(--c1);font-size:14px}
.th-clean.export .c-qbar button,.th-clean.export .c-qbar .fb{display:none}
.th-clean .c-qex{box-sizing:border-box;width:560px;overflow:auto;scrollbar-width:thin;padding:2px 0 0;background:var(--stage);font-size:12.5px;line-height:1.5;color:var(--ink)}
.th-clean .c-qex:empty{display:none}
.th-clean .c-qex p{margin:0}
.th-clean .c-qex p+p{margin-top:2px}
.th-clean .c-qex .why b{font-weight:600;color:var(--mute);margin-right:6px}
.th-clean [data-quiz] [data-opt]{cursor:pointer}
.th-clean [data-quiz].locked [data-opt]{cursor:default}
.th-clean .c-opt.sel{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.th-clean .c-opt.right{border-color:transparent;background:var(--c1-soft);color:var(--c1)}
.th-clean .c-opt.right::after{content:"✓";margin-left:auto;font-weight:700;color:var(--ok)}
.th-clean .c-opt.wrong{color:var(--off);text-decoration:line-through}
.th-clean button.c-chip{font-family:inherit;color:inherit;cursor:grab}

/* —— 页面外壳（工作台 / 贴纸） —— */
body.themed{color:var(--ink);font:14px/1.5 var(--sf)}
body.st-desk{--sf:"DeskSans","Microsoft YaHei",sans-serif;--tf:"DeskHand","Microsoft YaHei",sans-serif;background:var(--bg)}
body.st-sticker{--sf:"StickerSans","Microsoft YaHei",sans-serif;--tf:"StickerSans","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 2px 2px,var(--dot) 1px,transparent 1.5px) 0 0/16px 16px,var(--bg)}
.themed .bar{align-items:center;color:var(--mute)}
.themed #scr{font-family:var(--tf);font-size:16px;color:var(--ink)}
.st-desk #scr{display:inline-block;background:var(--tape);padding:2px 12px;border:1.5px solid var(--ink);box-shadow:2px 3px 0 var(--shadow);transform:rotate(-1deg)}
.st-sticker #scr{font-weight:900}.st-sticker #scr::before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;background:var(--acc);vertical-align:1px}
.themed .seg b{background:var(--off)}.themed .seg i{background:var(--acc)}
.st-desk .wrap{background:var(--bg);border:2px solid var(--ink);border-radius:10px;box-shadow:5px 6px 0 var(--shadow)}
.st-sticker .wrap{background:var(--bg);border:6px solid var(--paper);border-radius:16px;box-shadow:0 1px 1px rgb(0 0 0/.06),0 12px 28px -10px rgb(0 0 0/.3)}
.themed .cover{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.themed .cover button{font-family:var(--tf);background:var(--ink);color:var(--paper);border-radius:12px}
.st-desk .cover button{border:2px solid var(--ink);box-shadow:3px 4px 0 var(--shadow)}

.st-desk .quiz{border:1.8px solid var(--ink);border-radius:8px;box-shadow:3px 4px 0 var(--shadow)}
.st-sticker .quiz{border:0;border-radius:12px;box-shadow:0 1px 1px rgb(0 0 0/.06),0 8px 20px -6px rgb(0 0 0/.25)}
.themed .quiz .qh{font-family:var(--tf);font-size:16px;color:var(--ink)}
.st-sticker .quiz .qh{font-weight:900}
.themed .quiz .qs,.themed .qex,.themed .qopt .why{color:var(--mute)}
.themed .qopt{background:var(--field);border:1px solid var(--field-line);color:var(--ink)}
.st-sticker .qopt{border-color:var(--off)}
.themed .qopt.sel{border-color:var(--acc);background:var(--field);box-shadow:inset 0 0 0 1px var(--acc)}

.themed .qopt.right::before{content:"✓ ";color:var(--acc-line);font-weight:700}
.themed .qopt.wrong{border-color:var(--off);background:var(--field);color:var(--wrong);text-decoration:line-through}
.themed .qopt.wrong::before{content:"✗ ";color:var(--wrong);font-weight:700}
/* 解析不跟着划线：行内块不继承父元素的删除线 */
.themed .qopt.wrong .why{display:inline-block;width:100%;color:var(--mute)}
.themed .qbar .fb.ok{color:var(--acc-line)}.themed .qbar .fb.no{color:var(--mute)}
.themed .qbar button.go{background:var(--ink);color:var(--paper)}
.st-sticker .qbar button.go{background:var(--tile);color:var(--tile-ink)}
.themed .think{background:var(--acc-soft);color:var(--acc-line)}
.st-desk .think{background:var(--sticky);color:var(--ink);border:1.5px solid var(--ink);border-radius:4px}
.themed .think.ans{background:var(--acc-soft);color:var(--acc-line)}

<script>const DATA = {"title":"2.9 链式存储与链表 · 双栏稿","total":322.7370000000001,"steps":[{"k":"beat","n":1,"text":"顺序表把关系藏在位置里：a在c后面，就把a放在c的下一格。","audio":"audio/b001.mp3","start":0,"dur":4.738,"end":5.188000000000001,"card":0},{"k":"beat","n":2,"text":"这条约定不占空间，按位置取元素也一步到位。","audio":"audio/b002.mp3","start":5.188000000000001,"dur":3.28,"end":8.918,"card":1},{"k":"beat","n":3,"text":"可是挪动也是它带来的。在编辑器里，光标停在行首附近敲字，","audio":"audio/b003.mp3","start":8.918000000000001,"dur":4.295,"end":13.663,"card":2},{"k":"beat","n":4,"text":"每敲一下，光标右边的字符都要往后挪一格。","audio":"audio/b004.mp3","start":13.663,"dur":3.067,"end":17.18,"card":3},{"k":"beat","n":5,"text":"2.7节算过，这是O(n)。","audio":"audio/b005.mp3","start":17.18,"dur":2.021,"end":19.651,"card":4},{"k":"beat","n":6,"text":"放弃这条约定会怎样？","audio":"audio/b006.mp3","start":19.651,"dur":1.422,"end":21.523,"card":5},{"k":"beat","n":7,"text":"放弃之后，元素可以放在内存的任何地方。插入时随便找个空格子放进去，不用挪动任何字符。","audio":"audio/b007.mp3","start":21.523,"dur":6.217,"end":28.189999999999998,"card":6},{"k":"beat","n":8,"text":"各个字符是在不同时候放进去的，每次哪里有空就放哪里。","audio":"audio/b008.mp3","start":28.189999999999998,"dur":3.993,"end":32.633,"card":7},{"k":"beat","n":9,"text":"于是cat的三个字符可能散成这样：c在100号，t在105号，a在109号。","audio":"audio/b009.mp3","start":32.632999999999996,"dur":6.665,"end":39.748,"card":8},{"k":"beat","n":10,"text":"可是关系没了。按位置往后找，c的下一格并不是a。","audio":"audio/b010.mp3","start":39.748,"dur":3.651,"end":43.649,"card":9},{"k":"beat","n":11,"text":"位置已经不能告诉我们谁在谁后面。","audio":"audio/b011.mp3","start":43.649,"dur":2.457,"end":46.556000000000004,"card":9},{"k":"beat","n":12,"text":"要读出cat，得有别的办法知道：c的下一个是a，a的下一个是t。","audio":"audio/b012.mp3","start":46.556,"dur":4.841,"end":51.847,"card":10},{"k":"beat","n":13,"text":"放弃相邻格子放相邻元素这条约定，谁在谁后面的关系存到哪里？","audio":"audio/b013.mp3","start":51.846999999999994,"dur":5.337,"end":58.083999999999996,"card":11},{"k":"beat","n":14,"text":"办法是把关系明确地记下来：","audio":"audio/b014.mp3","start":58.083999999999996,"dur":1.914,"end":60.448,"card":12},{"k":"beat","n":15,"text":"在每个字符右边的格子里，写上下一个字符的地址。","audio":"audio/b015.mp3","start":60.44799999999999,"dur":3.433,"end":64.33099999999999,"card":13},{"k":"beat","n":16,"text":"右格里的109、105不是数据，是另一个格子的编号。","audio":"audio/b016.mp3","start":64.33099999999999,"dur":3.888,"end":68.669,"card":14},{"k":"beat","n":17,"text":"c的右格写着109，意思是c的下一个在109号。","audio":"audio/b017.mp3","start":68.66899999999998,"dur":4.196,"end":73.31499999999998,"card":15},{"k":"beat","n":18,"text":"到109号，读到a。","audio":"audio/b018.mp3","start":73.31499999999998,"dur":1.679,"end":75.44399999999999,"card":16},{"k":"beat","n":19,"text":"a的右格写着105，再到105号，读到t。","audio":"audio/b019.mp3","start":75.44399999999999,"dur":3.388,"end":79.282,"card":17},{"k":"beat","n":20,"text":"t的右格写着0，表示后面没有了。","audio":"audio/b020.mp3","start":79.28199999999998,"dur":2.851,"end":82.38299999999998,"card":18},{"k":"beat","n":21,"text":"地址0不会放任何变量，所以用它做结束标记。","audio":"audio/b021.mp3","start":82.38299999999998,"dur":3.197,"end":86.02999999999999,"card":18},{"k":"beat","n":22,"text":"还差一样：从哪开始读？我们看图知道c在最前面，程序却不知道。","audio":"audio/b022.mp3","start":86.02999999999999,"dur":4.552,"end":91.032,"card":19},{"k":"beat","n":23,"text":"所以还要另外记下第一个字符的地址：head等于100。","audio":"audio/b023.mp3","start":91.03199999999998,"dur":4.36,"end":95.84199999999998,"card":20},{"k":"beat","n":24,"text":"这就是新的存法。现在给它和它用到的东西起名字。","audio":"audio/b024.mp3","start":95.84199999999998,"dur":3.834,"end":100.12599999999999,"card":21},{"k":"beat","n":25,"text":"链式存储就是：每个元素旁边，记下它后一个元素的地址。元素本身放在哪个格子都行。","audio":"audio/b025.mp3","start":100.12599999999999,"dur":6.268,"end":106.844,"card":22},{"k":"beat","n":26,"text":"一格数据加一格地址，合起来叫一个结点。上图有三个结点，分别在100号、109号、105号。","audio":"audio/b026.mp3","start":106.844,"dur":6.88,"end":114.17399999999999,"card":23},{"k":"beat","n":27,"text":"结点用地址一个接一个串起来，这样存的线性表叫链表。","audio":"audio/b027.mp3","start":114.17399999999999,"dur":4.084,"end":118.708,"card":24},{"k":"beat","n":28,"text":"另外记下的第一个结点的地址head，叫头指针。","audio":"audio/b028.mp3","start":118.708,"dur":2.923,"end":122.081,"card":25},{"k":"beat","n":29,"text":"所以，一个链表，就是一串用地址连起来的结点，加上一个头指针。","audio":"audio/b029.mp3","start":122.081,"dur":4.496,"end":127.027,"card":26},{"k":"beat","n":30,"text":"结点和元素要分清。元素是c、a、t这些数据，结点是数据加下一个地址这两格。","audio":"audio/b030.mp3","start":127.027,"dur":6.423,"end":133.89999999999998,"card":27},{"k":"beat","n":31,"text":"回到开头的问题。谁在谁后面不再靠位置，而是存在每个结点的地址格里。","audio":"audio/b031.mp3","start":133.9,"dur":4.907,"end":139.70700000000002,"card":28},{"k":"beat","n":32,"text":"格子图看得清分开存，却看不清顺序。","audio":"audio/b032.mp3","start":139.707,"dur":2.585,"end":142.742,"card":29},{"k":"beat","n":33,"text":"把它简化一下：只画三个结点，按逻辑顺序从左往右摆，","audio":"audio/b033.mp3","start":142.742,"dur":3.92,"end":147.11199999999997,"card":30},{"k":"beat","n":34,"text":"方框下面标出结点的地址；","audio":"audio/b034.mp3","start":147.112,"dur":1.826,"end":149.38799999999998,"card":31},{"k":"beat","n":35,"text":"地址格里的数字画成箭头，指向那个地址上的结点。","audio":"audio/b035.mp3","start":149.388,"dur":3.084,"end":152.922,"card":32},{"k":"beat","n":36,"text":"这就是链表的箭头图。它和上面的格子图是同一份数据，只是画法不同。","audio":"audio/b036.mp3","start":152.922,"dur":4.353,"end":157.725,"card":33},{"k":"beat","n":37,"text":"格子图按内存位置排，t在a前面；箭头图按逻辑顺序排，t在最后。","audio":"audio/b037.mp3","start":157.725,"dur":5.342,"end":163.517,"card":34},{"k":"beat","n":38,"text":"两张图一一对应。c结点的地址格写着109，箭头就指向109号的a结点；","audio":"audio/b038.mp3","start":163.517,"dur":5.76,"end":169.72699999999998,"card":35},{"k":"beat","n":39,"text":"a结点的地址格写着105，箭头就指向105号的t结点。","audio":"audio/b039.mp3","start":169.727,"dur":4.509,"end":174.486,"card":36},{"k":"beat","n":40,"text":"箭头只是地址的画法，改了地址格里的数字，箭头就跟着变。","audio":"audio/b040.mp3","start":174.486,"dur":3.891,"end":178.82699999999997,"card":36},{"k":"beat","n":41,"text":"后面讲链表，都画箭头图。","audio":"audio/b041.mp3","start":178.827,"dur":1.85,"end":181.577,"card":37},{"k":"beat","n":42,"text":"放弃相邻约定，换来了什么，又付出了什么？","audio":"audio/b042.mp3","start":181.577,"dur":3.192,"end":185.219,"card":38},{"k":"beat","n":43,"text":"先看换来的。在a和t之间插入x：x放进任何一个空格子，比如102号；","audio":"audio/b043.mp3","start":185.219,"dur":5.95,"end":191.61899999999997,"card":39},{"k":"beat","n":44,"text":"x的地址格写105，接到t；","audio":"audio/b044.mp3","start":191.619,"dur":2.481,"end":194.54999999999998,"card":40},{"k":"beat","n":45,"text":"a的地址格从105改成102，让a接到x。","audio":"audio/b045.mp3","start":194.55,"dur":3.846,"end":198.846,"card":41},{"k":"beat","n":46,"text":"c、a、t一个都没挪，只改了两个地址格。","audio":"audio/b046.mp3","start":198.846,"dur":2.925,"end":202.02100000000002,"card":42},{"k":"beat","n":47,"text":"顺序表在这里要把t往后挪一格；插得越靠前，挪得越多。","audio":"audio/b047.mp3","start":202.02100000000002,"dur":4.633,"end":207.104,"card":42},{"k":"beat","n":48,"text":"删除也一样：要删掉x，只要把a的地址格从102改回105，同样一个元素都不挪。所以Insert和Delete本身，都不用挪动元素。","audio":"audio/b048.mp3","start":207.104,"dur":9.26,"end":217.264,"card":43},{"k":"beat","n":49,"text":"再看付出的。开头说过，相邻存放时，按位置一步就能取到元素。放弃相邻之后，位置算不出地址。","audio":"audio/b049.mp3","start":217.264,"dur":6.906,"end":224.62,"card":44},{"k":"beat","n":50,"text":"还是看原来的cat：要取t，只能从head出发：到100号读地址格，得到109；到109号读地址格，得到105；到105号，才读到t。","audio":"audio/b050.mp3","start":224.62,"dur":10.286,"end":235.356,"card":45},{"k":"beat","n":51,"text":"取第i个，也就是Get，要从第一个结点出发，顺着地址走i步，最坏走n−1步，是O(n)。","audio":"audio/b051.mp3","start":235.356,"dur":6.65,"end":242.456,"card":46},{"k":"beat","n":52,"text":"Insert、Delete也躲不开这一步。上面改的是a的地址格，可程序怎么知道a在109号？也只能从head走过去。","audio":"audio/b052.mp3","start":242.456,"dur":6.894,"end":249.79999999999998,"card":47},{"k":"beat","n":53,"text":"改地址本身只要一步，找到要改的结点却要从头走。插得越靠后，走得越远，最坏也是O(n)。","audio":"audio/b053.mp3","start":249.79999999999998,"dur":6.757,"end":257.00699999999995,"card":48},{"k":"beat","n":54,"text":"所以，放弃相邻约定，省掉的是挪动，付出的是走路。","audio":"audio/b054.mp3","start":257.007,"dur":3.699,"end":261.156,"card":49},{"k":"beat","n":55,"text":"另外两个操作，从定义就能看出来。一个链表只有结点和头指针，没有记长度。要知道有几个，只能从head出发数一遍，Length是O(n)。","audio":"audio/b055.mp3","start":261.156,"dur":9.821,"end":271.427,"card":50},{"k":"beat","n":56,"text":"Init只要让head等于NULL，一步就完成，O(1)。","audio":"audio/b056.mp3","start":271.427,"dur":3.651,"end":275.528,"card":51},{"k":"beat","n":57,"text":"五个操作，放在一起看。","audio":"audio/b057.mp3","start":275.528,"dur":1.525,"end":277.953,"card":52},{"k":"beat","n":58,"text":"轮到你了。","audio":"audio/b058.mp3","start":277.95300000000003,"dur":0.801,"end":279.204,"card":53},{"k":"beat","n":59,"text":"记住：谁在谁后面不再靠位置，而是存在每个结点的地址格里。","audio":"audio/b059.mp3","start":279.204,"dur":4.476,"end":284.13,"card":54},{"k":"pause","quiz":0,"start":284.13,"end":298.98,"card":55,"think":5},{"k":"beat","n":60,"text":"再来一题。","audio":"audio/b060.mp3","start":298.98,"dur":0.679,"end":300.109,"card":56},{"k":"pause","quiz":1,"start":300.10900000000004,"end":314.15900000000005,"card":57,"think":5},{"k":"beat","n":61,"text":"改地址格本身只要一步，步数全花在从头走到a上。","audio":"audio/b061.mp3","start":314.15900000000005,"dur":4.284,"end":319.343,"card":58},{"k":"beat","n":62,"text":"下一步：用C语言实现链表。","audio":"audio/b062.mp3","start":319.3430000000001,"dur":2.194,"end":322.7370000000001,"card":59}],"cards":[{"id":"1-01","html":"\u003cdiv class=\"abs\" style=\"left:40px;top:44px;\">\u003cdiv class=\"c-title new\">链式存储与链表\u003c/div>\u003c/div>\u003cdiv class=\"abs\" style=\"left:40px;top:86px;\">\u003cdiv class=\"card \" style=\"width:196px;height:84px;padding:0\">\u003cdiv class=\"abs\" style=\"left:12px;top:6px;\">\u003cspan class=\"c-cap \" style=\"white-space:nowrap\">编辑器\u003c/span>\u003c/div>\u003cdiv class=\"abs\" style=\"left:12px;top:32px;\">\u003cdiv class=\"ed sm new\">cat\u003cspan class=\"cur\">|\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"abs\" style=\"left:252px;top:86px;\">\u003cdiv class=\"card \" style=\"width:348px;height:104px;padding:0\">\u003cdiv class=\"abs\" style=\"left:0px;top:4px;\">\u003cdiv style=\"width:336px;text-align:right\">\u003cspan class=\"c-cap \" style=\"white-space:nowrap\">内存\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"abs\" style=\"left:6px;top:44px;\">\u003cdiv class=\"cells  mem\">\u003cd 不变）","start":181.577,"end":217.264},{"n":5,"name":"链式存储的得失：付出的（版面不变）","start":217.264,"end":277.95300000000003},{"n":6,"name":"练习1：这一行是什么？","start":277.95300000000003,"end":298.98},{"n":7,"name":"练习2：走几步，到哪个结点？","start":298.98,"end":319.3430000000001},{"n":8,"name":"下一步","start":319.3430000000001,"end":322.7370000000001}],"quizzes":[{"kind":"fill","stem":"\u003cp>一个链表在内存里是这样的，head等于108：\u003c/p>\u003cpre>\u003ccode>┌───┬───┬───┬───┬───┬───┬───┬───┬───┬───┬───┬───┬───┬───┬───┬───┐\n│   │   │ o │112│ k │ 0 │   │   │ b │102│   │   │ o │104│   │   │\n└───┴───┴───┴───┴───┴───┴───┴───┴───┴───┴───┴───┴───┴───┴───┴───┘\n 100 101 102 103 104 105 106 107 108 109 110 111 112 113 114 115\u003c/code>\u003c/pre>\u003cul>\u003cli>从head出发，依次经过的结点是 \u003cbutton type=\"button\" class=\"c-blank fq-b\" data-n=\"0\">\u003c/button>、\u003cbutton type=\"button\" class=\"c-blank fq-b\" data-n=\"1\">\u003c/button>、\u003cbutton type=\"button\" class=\"c-blank fq-b\" data-n=\"2\">\u003c/button>、\u003cbutton type=\"button\" class=\"c-blank fq-b\" data-n=\"3\">\u003c/button>\u003c/li>\u003c/ul>","answers":["108","102","112","104"],"options":["112","102","109","103","104","108","113"],"explain":"\u003cp>从108号开始，读到b，地址格是102；到102号读到o，地址格是112；到112号读到o，地址格是104；到104号读到k，地址格是0，结束。这一行是\u003ccode>book\u003c/code>。按位置从左往右读，会得到\u003ccode>okbo\u003c/code>。103、109、113是地址格，不是结点的地址。\u003c/p>"},{"kind":"fill","stem":"\u003cp>\u003ccode>cat\u003c/code>存成链表，c结点在100号，a结点在109号，t结点在105号，head等于100。\u003c/p>\u003cul>\u003cli>取第2个元素t，从第一个结点出发要走 \u003cbutton type=\"button\" class=\"c-blank fq-b\" data-n=\"0\">\u003c/button> 步\u003c/li>\u003cli>在第2个位置插入x，要先从头走到 \u003cbutton type=\"button\" class=\"c-blank fq-b\" data-n=\"1\">\u003c/button> 结点，改它的地址格\u003c/li>\u003c/ul>","answers":["2","a"],"options":["3","1","2","c","a","t"],"explain":"\u003cp>从c结点出发，走1步到a结点，走2步到t结点。x插在第2个位置，它前面是第1个结点a。要让a接到x，改的是a的地址格；t是x的后一个，不用改。改地址格本身只要一步，步数全花在从头走到a上。\u003c/p>"}],"inplace":true};</script>
<script>
const FADE = 0.3, POP = 0.45
const $ = (id) => document.getElementById(id)
const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0')
const stage = $('stage'), wrap = $('wrap')
const beats = DATA.steps.filter((s) => s.k === 'beat')
// 配音所在目录：不能直接用相对路径。线上 Vercel（cleanUrls、trailingSlash: false）会把 /course/2-1/index.html 重定向到 /course/2-1，
// 末尾没有 /，相对路径 audio/b001.mp3 会被解析成 /course/audio/b001.mp3（线上返回 200 的 404 页面，没有声音也不报错）。
// 地址以 .html 结尾（本地直接打开、file://）照常按文件所在目录解析；否则把末尾补上 /
const audioDir = new URL(location.href)
audioDir.search = ''
audioDir.hash = ''
if (!/\.html$/.test(audioDir.pathname)) audioDir.pathname = audioDir.pathname.replace(/\/?$/, '/')
// 配音按需加载：一开始都不下载，播到哪一拍再预先拉取这一拍和后面两拍（手机流量友好；网站上一节有几十段配音）
const audios = new Map(beats.map((s) => { const a = new Audio(); a.preload = 'none'; a.dataset.src = new URL(s.audio, audioDir).href; return [s.n, a] }))
function warm(n) {
  const i = beats.findIndex((s) => s.n === n)
  for (const s of beats.slice(Math.max(0, i), i + 3)) { const a = audios.get(s.n); if (!a.src) { a.src = a.dataset.src; a.preload = 'auto' } }
}

let t = 0, playing = false, speed = 1, curAudio = null, waitingQuiz = -1
const quizState = DATA.quizzes.map((Q) => Q.kind === 'fill'
  ? { filled: Q.answers.map(() => -1), pickO: -1, pickB: -1, status: 'idle' }
  : { sel: new Set(), checked: false, shown: false })
// 每拍开始的秒数：例题空位按拍填（帧里带 data-beat 的选项块）
const beatStart = new Map(beats.map((s) => [s.n, s.start]))
const BLANK_FADE = 0.25

// —— 进度线：每屏一段，宽度按这一屏的时长，段间缺口就是分屏标记（照抖音）；点哪儿跳哪儿，悬停显示屏名和时间 ——
const tip = $('tip')
const segAt = (s, el, e) => {
  const r = el.getBoundingClientRect(); return s.start + (s.end - s.start) * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
}
const segs = DATA.screens.map((s) => {
  const el = document.createElement('div'); el.className = 'seg'; el.innerHTML = '<b><i></i></b>'
  el.style.flex = (s.end - s.start).toFixed(2) + ' 1 0'
  el.onclick = (e) => { $('cover').hidden = true; seek(segAt(s, el, e), true) }
  el.onmousemove = (e) => {
    const box = $('dock').getBoundingClientRect()
    tip.textContent = s.name + '　' + fmt(segAt(s, el, e)) + ' / ' + fmt(DATA.total); tip.hidden = false
    const half = tip.offsetWidth / 2
    tip.style.left = Math.max(half, Math.min(box.width - half, e.clientX - box.left)) + 'px'
  }
  el.onmouseleave = () => { tip.hidden = true }
  $('prog').appendChild(el); return el
})
const fill = segs.map((el) => el.querySelector('i'))
// —— 跳屏：目录里点哪屏跳哪屏；"下一屏"跳到下一屏开头。都从屏首开始放 ——
const toc = $('toc')
const closeToc = () => { toc.hidden = true; $('menu').setAttribute('aria-expanded', 'false') }
const goScreen = (s) => { closeToc(); $('cover').hidden = true; seek(s.start, true) }
DATA.screens.forEach((s) => {
  const b = document.createElement('button')
  b.innerHTML = '<em>' + fmt(s.start) + '</em><span>' + s.name + '</span>'
  b.onclick = () => goScreen(s)
  toc.appendChild(b)
})
let scrIdx = 0
$('next').onclick = () => { const s = DATA.screens[scrIdx + 1]; if (s) goScreen(s) }

// —— 画面层：每帧一个 .f，只在第一次用到时创建 ——
const layers = new Map()
function layer(ci) {
  if (layers.has(ci)) return layers.get(ci)
  const c = DATA.cards[ci]
  const el = document.createElement('div'); el.className = 'f'; el.innerHTML = c.html; el.style.display = 'none'
  stage.appendChild(el)
  // 按拍填的空位（data-beat）不跟着帧一起出现，到那一拍才淡入；分镜墙上它们也带 new，这里排除
  const items = [...el.querySelectorAll('.new:not([data-beat])')]
  const span = c.reveal === 'spread' ? Math.max(0.6, c.speak * 0.85) : Math.min(0.6, 0.12 * items.length)
  const fills = [...el.querySelectorAll('[data-beat]')].map((node) => ({ node, at: beatStart.get(Number(node.dataset.beat)) ?? 0 }))
  const L = { el, items: items.map((node, i) => ({ node, at: items.length > 1 ? (span * i) / items.length : 0 })), fills }
  layers.set(ci, L); return L
}
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3))

function stepAt(time) {
  let lo = 0, hi = DATA.steps.length - 1
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (DATA.steps[mid].start <= time) lo = mid; else hi = mid - 1 }
  return lo
}

// —— 由时间算画面 ——
let shown = []
function render(time) {
  const sig = []
  const si = stepAt(time), step = DATA.steps[si], ci = step.card, local = time - DATA.cards[ci].start
  // 练习暂停时时钟停在暂停帧的第一刻：它不做淡入，直接显示（卡上作答就在这一帧上，淡入会停在全透明）
  const fade = ci > 0 && step.k !== 'pause'
  const vis = [ci]; if (fade && local < FADE) vis.push(ci - 1)
  for (const k of shown) if (!vis.includes(k)) layers.get(k).el.style.display = 'none'
  shown = vis
  const cur = layer(ci)
  cur.el.style.display = ''; cur.el.style.opacity = fade ? String(ease(local / FADE)) : '1'; cur.el.style.zIndex = '2'
  for (const it of cur.items) {
    const e = ease((local - it.at) / POP)
    // data-from：从这个透明度亮起来，原地变亮不上移（"由淡变亮"）；没有就从 0 淡入加上移
    const from = parseFloat(it.node.dataset.from ?? '0')
    sig.push(e.toFixed(3)); it.node.style.opacity = String(from + (1 - from) * e)
    it.node.style.translate = e < 1 && !it.node.dataset.from ? '0 ' + ((1 - e) * 8).toFixed(1) + 'px' : ''
  }
  for (const it of cur.fills) {
    const e = Math.max(0, Math.min(1, (time - it.at) / BLANK_FADE))
    sig.push('b' + e.toFixed(3)); it.node.style.opacity = String(e)
  }
  sig.unshift(ci, cur.el.style.opacity)
  if (vis.length > 1) { const p = layer(ci - 1); sig.push('p'); p.el.style.display = ''; p.el.style.opacity = String(1 - ease(local / FADE)); p.el.style.zIndex = '1' }

  // 练习题
  const q = step.k === 'pause' ? step.quiz : -1
  if (q !== quizShown) showQuiz(q)
  if (exportMode && q >= 0) sig.push('q' + q, videoQuiz(step, time - step.start))

  // 字幕、进度、时间、当前屏
  $('cap').textContent = step.k === 'beat' ? step.text : ''
  let k = DATA.screens.findIndex((s) => time >= s.start && time < s.end)
  if (k < 0) k = DATA.screens.length - 1
  if (k !== scrIdx || !$('scr').textContent) {
    scrIdx = k
    $('scr').textContent = $('scr').title = DATA.screens[k].name
    $('next').hidden = k === DATA.screens.length - 1
    toc.querySelectorAll('button').forEach((b, i) => b.classList.toggle('cur', i === k))
  }
  DATA.screens.forEach((s, i) => { fill[i].style.width = Math.max(0, Math.min(1, (time - s.start) / (s.end - s.start))) * 100 + '%' })
  $('time').textContent = fmt(time) + ' / ' + fmt(DATA.total)
  return sig.join(',')
}

// 视频里的练习题：先倒计时"自己想想"，再揭晓正确选项和解析。返回这一刻的状态，供导出时判断画面变没变
let exportMode = false
function videoQuiz(step, local) {
  const left = Math.ceil(step.think - local), revealed = left <= 0
  // 倒计时条：盖层题卡放在最后；卡上作答（质感版）放进按钮条，按钮在导出时藏起来
  const host = quizEl.inplace ? quizEl.querySelector('[data-qbar]') : quizEl
  let think = host.querySelector('.think')
  if (!think) { think = document.createElement('div'); think.className = 'think'; host.appendChild(think) }
  think.innerHTML = revealed ? '✓ 答案' : '⏸ 暂停一下，自己想想　<b>' + left + '</b>'
  think.classList.toggle('ans', revealed)
  quizEl.videoReveal(revealed)
  return revealed ? 'r' : String(left)
}

// —— 练习题（网页里可作答；导出视频时只显示题面）——
// 质感版（DATA.inplace）：帧里画的练习卡就是作答界面，暂停时直接给卡上的选项、空位、选项块、按钮条接上作答，
// 画面不换（生成时已核对卡上的选项和书稿对得上，见 wireQuizzes）。其他风格：在画面上盖一层题卡
let quizShown = -1, quizEl = null
function showQuiz(q) {
  quizShown = q
  if (quizEl && !quizEl.inplace) quizEl.remove()
  quizEl = null
  if (q < 0) return
  const Q = DATA.quizzes[q]
  const step = DATA.steps.find((x) => x.k === 'pause' && x.quiz === q)
  const root = DATA.inplace ? layer(step.card).el.querySelector('[data-quiz]') : null
  if (root) {
    quizEl = root; root.inplace = true
    const bar = root.querySelector('[data-qbar]')
    const ui = { fb: bar.querySelector('.fb'), btn: (c) => bar.querySelector(c), ex: root.querySelector('[data-ex]') }
    if (Q.kind === 'fill') {
      root.classList.add('fq')
      // 选项块在帧里画成 span，换成按钮才能点、能禁用；data-qi 是它在书稿选项里的下标
      root.querySelectorAll('span[data-chip]').forEach((el) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = el.className + ' fq-o'
        b.dataset.chip = ''; b.dataset.qi = el.dataset.qi; b.textContent = el.textContent; el.replaceWith(b)
      })
      ui.blanks = [...root.querySelectorAll('[data-blank]')]
      ui.opts = []
      root.querySelectorAll('[data-chip]').forEach((b) => { ui.opts[Number(b.dataset.qi)] = b })
      return bindFill(q, ui)
    }
    ui.opts = [...root.querySelectorAll('[data-opt]')].sort((a, b) => a.dataset.opt - b.dataset.opt)
    return bindChoice(q, ui)
  }
  quizEl = document.createElement('div'); quizEl.className = 'quiz'
  const n = DATA.steps.filter((s) => s.k === 'pause').findIndex((s) => s.quiz === q) + 1
  const btn = (c) => quizEl.querySelector(c)
  if (Q.kind === 'fill') return showFill(q, n)
  quizEl.innerHTML = '<div class="qh">练习' + n + '　' + (Q.kind === 'multi' ? '多选' : '单选') + '</div><div class="qs">' + Q.stem + '</div>' +
    Q.options.map((o, i) => '<button class="qopt" data-i="' + i + '">' + o.html + '<div class="why">' + o.why + '</div></button>').join('') +
    '<div class="qex">' + Q.explain + '</div>' +
    '<div class="qbar"><span class="fb"></span><button class="ck">检查</button><button class="ans">看答案</button><button class="go">继续 ▶</button></div>'
  stage.appendChild(quizEl)
  bindChoice(q, { opts: [...quizEl.querySelectorAll('.qopt')], fb: btn('.fb'), btn, ex: null })
}
const goOn = (q) => { const s = DATA.steps.find((x) => x.k === 'pause' && x.quiz === q); waitingQuiz = -1; seek(s.end, playing) }

// —— 选择题。ex 是卡上的解析位（盖层题卡没有：解析写在选项里和题卡底部，按 .done 显示）：
// 答错写选错的那几项的解析，答对、看答案写整题解析（没有整题解析就写正确选项的解析）——
function bindChoice(q, ui) {
  const Q = DATA.quizzes[q], st = quizState[q], opts = ui.opts, fb = ui.fb, ck = ui.btn('.ck')
  const whyOf = (i) => (Q.options[i].why ? '<div class="why"><b>' + String.fromCharCode(65 + i) + '</b>' + Q.options[i].why + '</div>' : '')
  const solved = () => Q.explain || Q.options.map((o, i) => (o.correct ? whyOf(i) : '')).join('')
  const writeEx = (html) => { if (ui.ex) ui.ex.innerHTML = html }
  const paint = () => {
    opts.forEach((b, i) => { b.classList.toggle('sel', st.sel.has(i) && !st.checked) })
    ck.disabled = st.sel.size === 0
    ck.textContent = st.checked && !st.right ? '再试一次' : '检查'
    quizEl.classList.toggle('locked', st.checked)
  }
  opts.forEach((b, i) => b.onclick = () => {
    if (st.checked) return
    if (Q.kind === 'single') st.sel = new Set([i]); else st.sel.has(i) ? st.sel.delete(i) : st.sel.add(i)
    paint()
  })
  ck.onclick = () => {
    if (st.checked) { st.checked = false; opts.forEach((b) => b.classList.remove('right', 'wrong')); fb.textContent = ''; st.sel.clear(); writeEx(''); paint(); return }
    st.checked = true
    const wrong = [...st.sel].filter((i) => !Q.options[i].correct)
    const miss = Q.options.filter((o, i) => o.correct && !st.sel.has(i)).length
    st.right = wrong.length === 0 && miss === 0
    if (st.right) { reveal(); fb.textContent = '答对了。'; fb.className = 'fb ok' }
    else {
      wrong.forEach((i) => opts[i].classList.add('wrong'))
      writeEx(wrong.map(whyOf).join(''))
      fb.textContent = Q.kind === 'multi' ? '选错了 ' + wrong.length + ' 个' + (miss ? '，还有漏选的' : '') : '不对，再想想。'
      fb.className = 'fb no'
    }
    paint()
  }
  const reveal = () => { Q.options.forEach((o, i) => { if (o.correct) opts[i].classList.add('right') }); quizEl.classList.add('done'); writeEx(solved()) }
  ui.btn('.ans').onclick = () => { st.checked = true; st.right = true; reveal(); fb.textContent = ''; paint() }
  ui.btn('.go').onclick = () => goOn(q)
  // 导出视频：倒计时时题面空着，揭晓时标出正确选项、写上解析
  quizEl.videoReveal = (on) => { opts.forEach((b, i) => b.classList.toggle('right', on && Q.options[i].correct)); quizEl.classList.toggle('done', on); writeEx(on ? solved() : '') }
  paint()
}

// —— 填空题（照网站 FillQuiz.vue）：点选项块再点空，或者先点空再点选项块，桌面上也能拖；点已填的空把选项块退回。
// 用过的选项块变灰；填满了才能检查；答错只标出错的空，可以再试一次（错的空退回）或看答案；答对、看答案之后显示解析 ——
function showFill(q, n) {
  const Q = DATA.quizzes[q]
  quizEl.className = 'quiz fq'
  quizEl.innerHTML = '<div class="qh">练习' + n + '　填空</div><div class="qs">' + Q.stem + '</div>' +
    '<div class="fq-opts" role="group" aria-label="选项">' + Q.options.map((o, i) => '<button type="button" class="c-fill fq-o" data-i="' + i + '"></button>').join('') + '</div>' +
    '<div class="qex">' + Q.explain + '</div>' +
    '<div class="qbar"><span class="fb" role="status"></span><button class="ck">检查</button><button class="retry">再试一次</button><button class="ans">看答案</button><button class="redo">重做</button><button class="go">继续 ▶</button></div>'
  stage.appendChild(quizEl)
  const opts = [...quizEl.querySelectorAll('.fq-o')], btn = (c) => quizEl.querySelector(c)
  opts.forEach((b, i) => { b.textContent = Q.options[i] })
  bindFill(q, { blanks: [...quizEl.querySelectorAll('.fq-b')], opts, fb: btn('.fb'), btn, ex: null })
}
// opts[i] 是书稿第 i 个选项的按钮（卡上作答时，画面上的排列可以和书稿不同）；ex 是卡上的解析位，答对、看答案后写整题解析
function bindFill(q, ui) {
  const Q = DATA.quizzes[q], st = quizState[q], blanks = ui.blanks, opts = ui.opts, btn = ui.btn, fb = ui.fb
  // 空位原来的样式类（帧里的空位可能带别的类），每次重画在它后面加作答状态
  const base = (b) => b.dataset.base ?? (b.dataset.base = [...b.classList].filter((c) => c !== 'fq-b' && !c.startsWith('is-')).join(' '))
  const locked = () => st.status !== 'idle'
  const used = () => new Set(st.filled.filter((x) => x >= 0))
  const isRight = (k) => st.filled[k] >= 0 && Q.options[st.filled[k]] === Q.answers[k]
  const place = (i, k) => { if (locked() || used().has(i)) return; st.filled[k] = i; st.pickO = st.pickB = -1; paint() }
  // 每个空放上一个写着正确答案的选项块（答案相同的块可以互换）
  const fillAnswers = () => { const taken = new Set(); st.filled = Q.answers.map((a) => { const i = Q.options.findIndex((o, j) => o === a && !taken.has(j)); taken.add(i); return i }) }
  const paint = () => {
    const u = used(), answered = st.status === 'right' || st.status === 'revealed'
    blanks.forEach((b, k) => {
      const i = st.filled[k], cls = base(b)
      b.textContent = ''
      if (i >= 0) { const c = document.createElement('span'); c.className = 'c-fill'; c.textContent = Q.options[i]; b.appendChild(c) }
      const s = answered ? 'right' : st.status === 'wrong' ? (isRight(k) ? '' : 'wrong') : i < 0 && st.pickB === k ? 'picked' : ''
      b.className = cls + ' fq-b' + (s ? ' is-' + s : '')
      b.setAttribute('aria-label', '第' + (k + 1) + '个空' + (i >= 0 ? '：' + Q.options[i] : ''))
    })
    opts.forEach((b, i) => { b.disabled = locked() || u.has(i); b.draggable = !b.disabled; b.classList.toggle('picked', st.pickO === i) })
    quizEl.classList.toggle('locked', locked()); quizEl.classList.toggle('done', answered)
    if (ui.ex) ui.ex.innerHTML = answered ? Q.explain : ''
    const wrongN = Q.answers.filter((_, k) => !isRight(k)).length
    fb.textContent = st.status === 'right' ? '答对了。' : st.status === 'revealed' ? '正确答案已填好。' : st.status === 'wrong' ? '还不对：有 ' + wrongN + ' 个空填错了。' : ''
    fb.className = 'fb' + (st.status === 'right' ? ' ok' : st.status === 'wrong' ? ' no' : '')
    btn('.ck').hidden = st.status !== 'idle'; btn('.ck').disabled = st.filled.some((x) => x < 0)
    btn('.retry').hidden = btn('.ans').hidden = st.status !== 'wrong'
    btn('.redo').hidden = !answered
  }
  opts.forEach((b, i) => {
    b.onclick = () => {
      if (locked() || used().has(i)) return
      if (st.pickB >= 0) return place(i, st.pickB)
      st.pickO = st.pickO === i ? -1 : i; paint()
    }
    b.ondragstart = (e) => { if (b.disabled) return e.preventDefault(); e.dataTransfer.setData('text/plain', String(i)); st.pickO = i; paint() }
  })
  blanks.forEach((b, k) => {
    b.onclick = () => {
      if (locked()) return
      if (st.filled[k] >= 0) { st.filled[k] = -1; paint(); return }
      if (st.pickO >= 0) return place(st.pickO, k)
      st.pickB = st.pickB === k ? -1 : k; paint()
    }
    b.ondragover = (e) => { if (!locked() && st.filled[k] < 0) e.preventDefault() }
    b.ondrop = (e) => { e.preventDefault(); const i = Number(e.dataTransfer.getData('text/plain')); if (Number.isInteger(i) && st.filled[k] < 0) place(i, k) }
  })
  btn('.ck').onclick = () => { if (st.filled.some((x) => x < 0)) return; st.status = Q.answers.every((_, k) => isRight(k)) ? 'right' : 'wrong'; paint() }
  btn('.retry').onclick = () => { st.filled = st.filled.map((x, k) => (isRight(k) ? x : -1)); st.status = 'idle'; paint() }
  btn('.ans').onclick = () => { fillAnswers(); st.status = 'revealed'; paint() }
  btn('.redo').onclick = () => { st.filled = Q.answers.map(() => -1); st.pickO = st.pickB = -1; st.status = 'idle'; paint() }
  btn('.go').onclick = () => goOn(q)
  // 导出视频：倒计时时空着，揭晓时把答案填好
  quizEl.videoReveal = (on) => { if (on) fillAnswers(); else st.filled = Q.answers.map(() => -1); st.status = on ? 'revealed' : 'idle'; paint(); fb.textContent = '' }
  paint()
}

// —— 播放：t 跟着音频走 ——
function stopAudio() { if (curAudio) { curAudio.pause(); curAudio = null } }
let last = 0
function tick(now) {
  const dt = last ? (now - last) / 1000 : 0; last = now
  if (playing) {
    const step = DATA.steps[stepAt(t)]
    if (step.k === 'pause') {
      stopAudio(); t = step.start; waitingQuiz = step.quiz
    } else {
      const a = audios.get(step.n), local = t - step.start
      if (curAudio !== a) { stopAudio(); warm(step.n); if (local < step.dur) { curAudio = a; a.currentTime = local; a.playbackRate = speed; a.play().catch(() => {}) } }
      // 以音频为准：服务器不支持分段请求时，中途跳转会从这一拍开头放起，画面也跟着回到拍首
      if (curAudio === a && !a.paused && !a.ended) { const at = step.start + a.currentTime; if (at > t || t - at > 0.3) t = at }
      else t += dt * speed
      if (t >= DATA.total) { t = DATA.total - 0.001; setPlaying(false); $('cover').hidden = false; $('startLabel').textContent = '↻ 重新播放'; if (window.__onEnded) window.__onEnded() }
    }
    render(t)
  }
  requestAnimationFrame(tick)
}
function setPlaying(p) { playing = p; if (typeof wake === 'function') wake(); $('play').classList.toggle('on', p); $('play').setAttribute('aria-label', p ? '暂停' : '播放'); if (!p) stopAudio() }
function seek(time, keepPlaying) {
  stopAudio(); t = Math.max(0, Math.min(DATA.total - 0.001, time)); render(t)
  if (keepPlaying !== undefined) setPlaying(keepPlaying)
}
function jumpBeat(dir) {
  const i = beats.findIndex((s) => s.start > t + 0.001)
  const cur = (i < 0 ? beats.length : i) - 1
  let k = dir > 0 ? cur + 1 : (cur >= 0 && t - beats[cur].start > 1 ? cur : cur - 1)
  k = Math.max(0, Math.min(beats.length - 1, k)); seek(beats[k].start, playing)
}

$('start').onclick = () => { $('cover').hidden = true; if (t >= DATA.total - 0.01) t = 0; setPlaying(true) }
$('play').onclick = () => { $('cover').hidden = true; setPlaying(!playing) }
// 倍速：点一下换下一档
const SPEEDS = [0.8, 1, 1.25, 1.5]
$('speed').onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('speed').textContent = speed + '×'
  if (curAudio) curAudio.playbackRate = speed
}
const toggleCap = () => {
  const on = $('capOn').getAttribute('aria-pressed') !== 'true'
  $('capOn').setAttribute('aria-pressed', String(on)); $('cap').classList.toggle('off', !on)
}
$('capOn').onclick = toggleCap
$('menu').onclick = (e) => { e.stopPropagation(); toc.hidden = !toc.hidden; $('menu').setAttribute('aria-expanded', String(!toc.hidden)) }
document.addEventListener('click', (e) => { if (!toc.hidden && !toc.contains(e.target)) closeToc() })
$('startLabel').textContent = '开始播放 · ' + fmt(DATA.total)
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return
  if (e.key === ' ') { e.preventDefault(); $('cover').hidden = true; setPlaying(!playing) }
  else if (e.key === 'ArrowLeft') jumpBeat(-1)
  else if (e.key === 'ArrowRight') jumpBeat(1)
  else if (e.key === 'c' || e.key === 'C') toggleCap()
  else if ((e.key === 'f' || e.key === 'F') && !$('fs').hidden) toggleFs()
  else if (e.key === 'Escape') closeToc()
})

// —— 真全屏（浏览器全屏接口，网站的 iframe 带 allow="fullscreen"）；不支持的浏览器（iPhone）不显示按钮 ——
const isFs = () => Boolean(document.fullscreenElement)
const toggleFs = () => (isFs() ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {})
if (document.fullscreenEnabled) $('fs').hidden = false
$('fs').onclick = toggleFs
let fsLeftAt = -Infinity
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fs', isFs())
  $('fs').setAttribute('aria-label', isFs() ? '退出全屏' : '全屏'); $('fs').title = isFs() ? '退出全屏（F / Esc）' : '全屏（F）'
  if (!isFs()) fsLeftAt = performance.now()
  wake(); fitWrap()
})
// 全屏里播放时鼠标 2.5 秒不动，控制区淡出；动一下、按键、暂停、目录开着时都显示
let idleTimer = 0
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleTimer)
  idleTimer = setTimeout(() => { if (isFs() && playing && toc.hidden) document.body.classList.add('idle') }, 2500)
}
for (const ev of ['mousemove', 'pointerdown', 'keydown']) document.addEventListener(ev, wake, { passive: true })

// —— 画布缩放 ——
// 嵌入网站、或真全屏时整屏只有这一页：先按宽、高两个方向算出舞台最大能多大（扣掉控制区、字幕和留白），再按舞台宽度缩放画布。
// 控制区和字幕跟画面同宽，看起来是一台播放器；真全屏时控制区叠在画面上，不扣它的高度
function fitWrap() {
  const dock = $('dock'), cap = $('cap')
  if (!document.body.classList.contains('embed') && !isFs()) { wrap.style.width = dock.style.width = cap.style.maxWidth = ''; return }
  const main = document.querySelector('main'), cs = getComputedStyle(main)
  const px = (v) => parseFloat(v) || 0
  const w = main.clientWidth - px(cs.paddingLeft) - px(cs.paddingRight)
  const under = isFs() ? 0 : dock.offsetHeight + px(getComputedStyle(dock).marginTop)
  const h = innerHeight - px(cs.paddingTop) - px(cs.paddingBottom) - under - cap.offsetHeight - px(getComputedStyle(cap).marginTop)
  const width = Math.max(160, Math.floor(Math.min(w, (h * 16) / 9)))
  wrap.style.width = width + 'px'
  dock.style.width = isFs() ? '' : width + 'px'
  cap.style.maxWidth = Math.floor(width * 0.9) + 'px'
  // 真全屏：控制区叠在画面底边上（照 YouTube），不压住下面的字幕
  dock.style.bottom = isFs() ? Math.max(0, innerHeight - wrap.getBoundingClientRect().bottom) + 'px' : ''
}
addEventListener('resize', fitWrap)
const fit = () => { stage.style.transform = 'scale(' + wrap.clientWidth / 640 + ')' }
new ResizeObserver(fit).observe(wrap); fit()

// —— 导出视频用：给定秒数，画出那一刻（不放声音）——
window.__duration = DATA.total
window.__seek = (time) => { exportMode = true; document.body.classList.add('export'); $('cover').hidden = true; setPlaying(false); t = time; return render(time) }

// —— 风格切换：带上当前秒数，到新页面接着放 ——
document.querySelectorAll('.sty a').forEach((a) => a.onclick = (e) => { e.preventDefault(); location.href = a.getAttribute('href') + '?t=' + t.toFixed(2) })
// —— 贴纸版的色系（记在 localStorage）——
const pal = $('pal')
if (pal) {
  const set = (v) => { document.documentElement.dataset.palette = v; pal.value = v }
  const saved = localStorage.getItem('course-palette'); if (saved && [...pal.options].some((o) => o.value === saved)) set(saved)
  pal.onchange = () => { set(pal.value); localStorage.setItem('course-palette', pal.value) }
}

const params = new URLSearchParams(location.search)
const t0 = parseFloat(params.get('t'))
if (t0 > 0 && t0 < DATA.total) { t = t0; $('startLabel').textContent = '接着播放 · ' + fmt(t) + ' / ' + fmt(DATA.total) }
// —— 嵌入网站节页（?embed）：全屏学习层。告诉外层页面：播完了、要退出、要改读文字、要问 AI；外层可以让它重新播放、暂停 ——
if (params.has('embed') && window.parent !== window) {
  document.body.classList.add('embed')
  const post = (msg) => window.parent.postMessage(Object.assign({ source: 'ds-course' }, msg), '*')
  window.__onEnded = () => post({ type: 'ended' })
  $('exit').onclick = () => post({ type: 'exit' })
  $('toText').onclick = () => { setPlaying(false); post({ type: 'text' }) }
  // 全屏里问 AI：先退出全屏，侧栏才看得见
  $('ask').onclick = () => { setPlaying(false); (isFs() ? document.exitFullscreen().catch(() => {}) : Promise.resolve()).then(() => post({ type: 'ask' })) }
  // Esc：目录开着先关目录，否则退出。全屏时 Esc 归浏览器退出全屏，不连带退出动画
  // 捕获阶段先于上面关目录的那个监听器，才能看到按下时目录是不是开着
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && toc.hidden && !isFs() && performance.now() - fsLeftAt > 500) post({ type: 'exit' })
  }, true)
  window.addEventListener('message', (e) => {
    const d = e.data
    if (e.source !== window.parent || !d || d.source !== 'ds-site') return
    if (d.type === 'replay') { t = 0; $('start').click() }
    else if (d.type === 'pause') setPlaying(false)
  })
  fitWrap()
}
render(t); requestAnimationFrame(tick)
</script>
</body></html>
